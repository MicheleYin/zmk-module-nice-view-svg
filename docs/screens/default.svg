<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 160 68" shape-rendering="crispEdges">
  <title>Sofle - Minimal Default Status</title>
  <rect width="160" height="68" fill="#fff"/>

  <g id="battery-left" data-nvp-widget="battery">
    <text x="4" y="12" font-family="monospace" font-size="9" font-weight="bold">L</text>
    <rect x="17.5" y="4.5" width="21" height="9" rx="1" fill="none" stroke="#000"/>
    <rect x="39" y="7" width="2" height="4"/>
    <rect x="20" y="7" width="15" height="4" data-nvp-slot="level" data-nvp-bind="battery.left.percent" data-nvp-render="bar"/>
    <path d="M29 4L25 9H28L27 14L33 8H30L32 4Z" fill="#fff" stroke="#000" stroke-width=".6" data-nvp-slot="charge" data-nvp-bind="battery.left.charge" data-nvp-render="visible" data-nvp-when="charging" data-nvp-bounds="25,4,8,10"/>
    <text x="46" y="12" font-family="monospace" font-size="9" font-weight="bold" data-nvp-slot="level" data-nvp-bind="battery.left.percent" data-nvp-render="percent">87%</text>
  </g>
  <g id="battery-right" data-nvp-widget="battery">
    <text x="4" y="27" font-family="monospace" font-size="9" font-weight="bold">R</text>
    <rect x="17.5" y="19.5" width="21" height="9" rx="1" fill="none" stroke="#000"/>
    <rect x="39" y="22" width="2" height="4"/>
    <rect x="20" y="22" width="15" height="4" data-nvp-slot="level" data-nvp-bind="battery.right.percent" data-nvp-render="bar"/>
    <text x="46" y="27" font-family="monospace" font-size="9" font-weight="bold" data-nvp-slot="level" data-nvp-bind="battery.right.percent" data-nvp-render="percent">64%</text>
  </g>

  <g id="layer-display" data-nvp-widget="layer">
    <text x="130" y="10" text-anchor="middle" font-family="monospace" font-size="7">LAYER</text>
    <text x="130" y="29" text-anchor="middle" font-family="monospace" font-size="23" font-weight="bold" data-nvp-slot="value" data-nvp-bind="layer.index" data-nvp-render="text">0</text>
  </g>
  <path d="M3 34H157" stroke="#000" stroke-width="1"/>

  <text x="4" y="45" font-family="monospace" font-size="8" font-weight="bold">BLE</text>
  <g id="ble-profile-1" data-nvp-widget="profile_tile">
    <rect x="35" y="37" width="19" height="15" rx="2" fill="#fff" stroke="#000"/>
    <text x="44.5" y="48" text-anchor="middle" font-family="monospace" font-size="9">1</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="0" data-nvp-bounds="35,37,19,15"><rect x="35" y="37" width="19" height="15" rx="2" fill="#000"/><text x="44.5" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">1</text></g>
    <circle cx="50.5" cy="39.5" r="2" fill="#fff" stroke="#000" stroke-width=".6" data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles" data-nvp-render="visible" data-nvp-when="set" data-nvp-bit="0" data-nvp-bounds="48,37,5,5"/>
  </g>
  <g id="ble-profile-2" data-nvp-widget="profile_tile">
    <rect x="60" y="37" width="19" height="15" rx="2" fill="#fff" stroke="#000"/>
    <text x="69.5" y="48" text-anchor="middle" font-family="monospace" font-size="9">2</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="1" data-nvp-bounds="60,37,19,15"><rect x="60" y="37" width="19" height="15" rx="2" fill="#000"/><text x="69.5" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">2</text></g>
    <circle cx="75.5" cy="39.5" r="2" fill="#fff" stroke="#000" stroke-width=".6" data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles" data-nvp-render="visible" data-nvp-when="set" data-nvp-bit="1" data-nvp-bounds="73,37,5,5"/>
  </g>
  <g id="ble-profile-3" data-nvp-widget="profile_tile">
    <rect x="85" y="37" width="19" height="15" rx="2" fill="#fff" stroke="#000"/>
    <text x="94.5" y="48" text-anchor="middle" font-family="monospace" font-size="9">3</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="2" data-nvp-bounds="85,37,19,15"><rect x="85" y="37" width="19" height="15" rx="2" fill="#000"/><text x="94.5" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">3</text></g>
    <circle cx="100.5" cy="39.5" r="2" fill="#fff" stroke="#000" stroke-width=".6" data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles" data-nvp-render="visible" data-nvp-when="set" data-nvp-bit="2" data-nvp-bounds="98,37,5,5"/>
  </g>
  <g id="ble-profile-4" data-nvp-widget="profile_tile">
    <rect x="110" y="37" width="19" height="15" rx="2" fill="#fff" stroke="#000"/>
    <text x="119.5" y="48" text-anchor="middle" font-family="monospace" font-size="9">4</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="3" data-nvp-bounds="110,37,19,15"><rect x="110" y="37" width="19" height="15" rx="2" fill="#000"/><text x="119.5" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">4</text></g>
    <circle cx="125.5" cy="39.5" r="2" fill="#fff" stroke="#000" stroke-width=".6" data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles" data-nvp-render="visible" data-nvp-when="set" data-nvp-bit="3" data-nvp-bounds="123,37,5,5"/>
  </g>
  <g id="ble-profile-5" data-nvp-widget="profile_tile">
    <rect x="135" y="37" width="19" height="15" rx="2" fill="#fff" stroke="#000"/>
    <text x="144.5" y="48" text-anchor="middle" font-family="monospace" font-size="9">5</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="4" data-nvp-bounds="135,37,19,15"><rect x="135" y="37" width="19" height="15" rx="2" fill="#000"/><text x="144.5" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">5</text></g>
    <circle cx="150.5" cy="39.5" r="2" fill="#fff" stroke="#000" stroke-width=".6" data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles" data-nvp-render="visible" data-nvp-when="set" data-nvp-bit="4" data-nvp-bounds="148,37,5,5"/>
  </g>

  <path d="M3 55H157" stroke="#000" stroke-width="1"/>
  <g id="connection-status" data-nvp-widget="connection">
    <text x="4" y="65" font-family="monospace" font-size="8" data-nvp-slot="selected" data-nvp-bind="output.selected" data-nvp-render="text" data-nvp-format="output-label">USB</text>
    <circle cx="30" cy="62" r="2.5" data-nvp-slot="selected" data-nvp-bind="output.selected" data-nvp-render="visible" data-nvp-when="usb"/>
    <circle cx="30" cy="62" r="2.5" data-nvp-slot="selected" data-nvp-bind="output.selected" data-nvp-render="visible" data-nvp-when="ble"/>
  </g>
  <text x="99" y="65" font-family="monospace" font-size="8">SPLIT</text>
  <g id="split-link" data-nvp-widget="split_link">
    <circle cx="151" cy="62" r="2.5" data-nvp-slot="connected" data-nvp-bind="split.connected" data-nvp-render="visible" data-nvp-when="true" data-nvp-role="peripheral" data-nvp-bounds="148.5,59.5,5,5"/>
  </g>
</svg>
