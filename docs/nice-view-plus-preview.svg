<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="340"
     viewBox="0 0 160 68"
     shape-rendering="crispEdges">

  <title>Nice!view Plus — Status Screen</title>
  <desc>Monochrome keyboard status display with charging battery, peripheral battery, layer, BLE profiles, USB and split status.</desc>

  <rect width="160" height="68" fill="#fff"/>

  <!-- ================= BATTERIES ================= -->

  <!-- Central battery: 87%, charging -->
  <g stroke="#000" stroke-width="1" fill="none">
    <rect x="3.5" y="3.5" width="22" height="10" rx="1"/>
  </g>

  <!-- Battery terminal -->
  <rect x="26" y="6" width="2" height="5" fill="#000"/>

  <!-- 87% battery fill -->
  <rect x="6" y="6" width="15" height="5" fill="#000"
        data-nvp-bind="battery.central.percent" data-nvp-render="bar"/>

  <!-- Charging lightning bolt: white cutout -->
  <path d="M15 4
           L11 9
           H14
           L13 13
           L19 7
           H16
           L18 4
           Z"
        fill="#fff"
        stroke="#000"
        stroke-width="0.65"
      stroke-linejoin="miter"
      data-nvp-bind="battery.central.charge" data-nvp-render="visible"
      data-nvp-when="charging" data-nvp-bounds="11,4,9,9"/>

  <!-- Peripheral battery: 64%, discharging -->
  <g stroke="#000" stroke-width="1" fill="none">
    <rect x="3.5" y="18.5" width="22" height="10" rx="1"/>
  </g>

  <!-- Battery terminal -->
  <rect x="26" y="21" width="2" height="5" fill="#000"/>

  <!-- 64% battery fill -->
  <rect x="6" y="21" width="15" height="5" fill="#000"
        data-nvp-bind="battery.peripheral.percent" data-nvp-render="bar"/>

  <!-- Battery labels and percentages -->
  <g font-family="monospace"
     font-size="8"
     fill="#000">

    <text x="32" y="11" data-nvp-bind="battery.central.percent"
          data-nvp-render="percent" data-nvp-prefix="C ">87%</text>
    <text x="32" y="26" data-nvp-bind="battery.peripheral.percent"
          data-nvp-render="percent" data-nvp-prefix="P ">64%</text>

  </g>

  <!-- ================= LAYER ================= -->

  <rect x="113.5" y="2.5"
        width="43" height="27"
        rx="2"
        fill="none"
        stroke="#000"
        stroke-width="1"/>

  <text x="118" y="10"
        font-family="monospace"
        font-size="6"
        fill="#000">LAYER</text>

  <text x="135" y="26"
        text-anchor="middle"
        font-family="monospace"
        font-size="20"
        font-weight="bold"
      fill="#000"
      data-nvp-bind="layer.index" data-nvp-render="text">0</text>

  <!-- ================= DIVIDER ================= -->

  <path d="M2 33H158"
        stroke="#000"
        stroke-width="1"/>

  <!-- ================= BLE PROFILES ================= -->

  <text x="4" y="41"
        font-family="monospace"
        font-size="7"
        fill="#000">BLE</text>

  <g font-family="monospace"
     font-size="8"
     text-anchor="middle">

    <rect x="37" y="36.5"
          width="18" height="15"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="46" y="47" fill="#000">1</text>

    <!-- Other profiles -->
    <rect x="59.5" y="36.5"
          width="18" height="15"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="69" y="47" fill="#000">2</text>

    <rect x="82" y="36"
          width="18" height="15"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="91" y="47" fill="#000">3</text>

    <rect x="104" y="36"
          width="18" height="15"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="113" y="47" fill="#000">4</text>

    <rect x="126" y="36"
          width="18" height="15"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="135" y="47" fill="#000">5</text>

    <rect x="37" y="36" width="18" height="15" rx="2" fill="#000"
          data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="0"/>
    <text x="46" y="47" fill="#fff" data-nvp-bind="ble.active_profile"
          data-nvp-render="visible" data-nvp-when="0"
          data-nvp-bounds="37,36,18,15">1</text>
    <rect x="59.5" y="36" width="18" height="15" rx="2" fill="#000"
          data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="1"/>
    <text x="69" y="47" fill="#fff" data-nvp-bind="ble.active_profile"
          data-nvp-render="visible" data-nvp-when="1"
          data-nvp-bounds="59,36,18,15">2</text>
    <rect x="82" y="36" width="18" height="15" rx="2" fill="#000"
          data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="2"/>
    <text x="91" y="47" fill="#fff" data-nvp-bind="ble.active_profile"
          data-nvp-render="visible" data-nvp-when="2"
          data-nvp-bounds="82,36,18,15">3</text>
    <rect x="104" y="36" width="18" height="15" rx="2" fill="#000"
          data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="3"/>
    <text x="113" y="47" fill="#fff" data-nvp-bind="ble.active_profile"
          data-nvp-render="visible" data-nvp-when="3"
          data-nvp-bounds="104,36,18,15">4</text>
    <rect x="126" y="36" width="18" height="15" rx="2" fill="#000"
          data-nvp-bind="ble.active_profile" data-nvp-render="visible" data-nvp-when="4"/>
    <text x="135" y="47" fill="#fff" data-nvp-bind="ble.active_profile"
          data-nvp-render="visible" data-nvp-when="4"
          data-nvp-bounds="126,36,18,15">5</text>

  </g>

  <!-- ================= BOTTOM DIVIDER ================= -->

  <path d="M2 55H158"
        stroke="#000"
        stroke-width="1"/>

  <!-- ================= USB STATUS ================= -->

  <text x="4" y="65"
        font-family="monospace"
        font-size="8"
      fill="#000" data-nvp-bind="output.selected" data-nvp-render="text"
      data-nvp-format="output-label">USB</text>

  <!-- USB connected -->
  <circle cx="31" cy="62"
          r="3"
          fill="#000" data-nvp-bind="output.selected" data-nvp-render="visible"
          data-nvp-when="usb"/>

  <!-- ================= SPLIT STATUS ================= -->

  <text x="88" y="65"
        font-family="monospace"
        font-size="8"
        fill="#000">SPLIT</text>

  <rect x="125" y="58"
        width="14" height="9"
        rx="1"
        fill="#fff"
        stroke="#000"/>

  <text x="132" y="65"
        text-anchor="middle"
        font-family="monospace"
        font-size="7"
      fill="#000">L</text>

  <!-- Right half -->
  <rect x="143" y="58"
        width="14" height="9"
        rx="1"
        fill="#fff"
        stroke="#000"/>

  <text x="150" y="65"
        text-anchor="middle"
        font-family="monospace"
        font-size="7"
        fill="#000">R</text>

  <rect x="125" y="58" width="14" height="9" rx="1" fill="#000"
        data-nvp-bind="display.half" data-nvp-render="visible" data-nvp-when="left"/>
  <text x="132" y="65" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff"
        data-nvp-bind="display.half" data-nvp-render="visible" data-nvp-when="left"
        data-nvp-bounds="125,58,14,9">L</text>
  <rect x="143" y="58" width="14" height="9" rx="1" fill="#000"
        data-nvp-bind="display.half" data-nvp-render="visible" data-nvp-when="right"/>
  <text x="150" y="65" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff"
        data-nvp-bind="display.half" data-nvp-render="visible" data-nvp-when="right"
        data-nvp-bounds="143,58,14,9">R</text>

</svg>
