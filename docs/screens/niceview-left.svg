<svg xmlns="http://www.w3.org/2000/svg"
      width="800" height="340"
      viewBox="0 0 160 68"
      shape-rendering="crispEdges">

      <title>Nice!view Plus — Day, Large Widgets</title>
  <image
href="image.png"
           width="160"
            height="68"
      />


      <!-- ================= BACKGROUND ================= -->


      <!-- ================= LEFT BATTERY ================= -->

      <g id="battery-left" data-nvp-widget="battery">


            <!-- Battery outline -->
            <rect x="5" y="5"
                  width="25" height="10"
                  fill="none"
                  stroke="#000" />

            <!-- Terminal -->
            <rect x="30" y="8"
                  width="2.5" height="4"
                  fill="#000" />

            <!-- Battery fill -->
            <rect x="7" y="8"
                  width="19" height="4"
                  fill="#000"
                  data-nvp-slot="level"
                  data-nvp-bind="battery.left.percent"
                  data-nvp-render="bar" />
            <!-- // translate this 5 px -->
            <path d="M34 5L30 10H33L32 15L38 9H35L37 5Z"
                  fill="#fff" stroke="#000" stroke-width=".6"
                  data-nvp-slot="charge"
                  data-nvp-bind="battery.left.charge"
                  data-nvp-render="visible"
                  data-nvp-when="charging"
                  data-nvp-bounds="13,5,8,10"
                  transform="translate(-17,0)" />

      </g>


      <!-- ================= LAYER DISPLAY ================= -->

      <g id="layer-display" data-nvp-widget="layer">

            <text x="141" y="10"
                  text-anchor="middle"
                  font-family="monospace"
                  font-size="8"
                  font-weight="bold">LAYER</text>

            <text x="141" y="27" text-anchor="middle" font-family="monospace"
                  font-size="21" font-weight="bold" data-nvp-slot="value"
                  data-nvp-bind="layer.index" data-nvp-render="visible"
                  data-nvp-when="0" data-nvp-bounds="130,6,22,24">0</text>
            <text x="141" y="27" text-anchor="middle" font-family="monospace"
                  font-size="21" font-weight="bold" data-nvp-slot="value"
                  data-nvp-bind="layer.index" data-nvp-render="visible"
                  data-nvp-when="1" data-nvp-bounds="130,6,22,24">1</text>
            <text x="141" y="27" text-anchor="middle" font-family="monospace"
                  font-size="21" font-weight="bold" data-nvp-slot="value"
                  data-nvp-bind="layer.index" data-nvp-render="visible"
                  data-nvp-when="2" data-nvp-bounds="130,6,22,24">2</text>
            <text x="141" y="27" text-anchor="middle" font-family="monospace"
                  font-size="21" font-weight="bold" data-nvp-slot="value"
                  data-nvp-bind="layer.index" data-nvp-render="visible"
                  data-nvp-when="3" data-nvp-bounds="130,6,22,24">3</text>
            <text x="141" y="27" text-anchor="middle" font-family="monospace"
                  font-size="21" font-weight="bold" data-nvp-slot="value"
                  data-nvp-bind="layer.index" data-nvp-render="visible"
                  data-nvp-when="4" data-nvp-bounds="130,6,22,24">4</text>

      </g>


      <!-- SINGLE ACTIVE BLE PROFILE (1–5) -->
      <!-- Uses visibility conditions so the displayed number is one-based. -->
      <g id="ble-active-profile" data-nvp-widget="profile_tile">
            <rect x="5" y="51" width="17" height="13" rx="2" fill="#000" />

            <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
                  data-nvp-render="visible" data-nvp-when="0"
                  data-nvp-bounds="5,51,17,13">
                  <text x="13.5" y="61" text-anchor="middle" font-family="monospace"
                        font-size="10" font-weight="bold" fill="#fff">1</text>
            </g>
            <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
                  data-nvp-render="visible" data-nvp-when="1"
                  data-nvp-bounds="5,51,17,13">
                  <text x="13.5" y="61" text-anchor="middle" font-family="monospace"
                        font-size="10" font-weight="bold" fill="#fff">2</text>
            </g>
            <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
                  data-nvp-render="visible" data-nvp-when="2"
                  data-nvp-bounds="5,51,17,13">
                  <text x="13.5" y="61" text-anchor="middle" font-family="monospace"
                        font-size="10" font-weight="bold" fill="#fff">3</text>
            </g>
            <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
                  data-nvp-render="visible" data-nvp-when="3"
                  data-nvp-bounds="5,51,17,13">
                  <text x="13.5" y="61" text-anchor="middle" font-family="monospace"
                        font-size="10" font-weight="bold" fill="#fff">4</text>
            </g>
            <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
                  data-nvp-render="visible" data-nvp-when="4"
                  data-nvp-bounds="5,51,17,13">
                  <text x="13.5" y="61" text-anchor="middle" font-family="monospace"
                        font-size="10" font-weight="bold" fill="#fff">5</text>
            </g>
      </g>


      <!-- ================= HOST STATUS ================= -->

      <g id="connection-status" data-nvp-widget="connection">

            <rect x="113" y="52"
                  width="26" height="11"
                  fill="#fff"
                  stroke="#000" />

            <text x="114" y="60" font-family="monospace" font-size="10"
                  font-weight="bold" data-nvp-slot="selected"
                  data-nvp-bind="output.selected" data-nvp-render="visible"
                  data-nvp-when="usb" data-nvp-bounds="113,52,26,11">USB</text>
            <text x="114" y="60" font-family="monospace" font-size="10"
                  font-weight="bold" data-nvp-slot="selected"
                  data-nvp-bind="output.selected" data-nvp-render="visible"
                  data-nvp-when="ble" data-nvp-bounds="113,52,26,11">BLE</text>
            <text x="114" y="60" font-family="monospace" font-size="10"
                  font-weight="bold" data-nvp-slot="selected"
                  data-nvp-bind="output.selected" data-nvp-render="visible"
                  data-nvp-when="none" data-nvp-bounds="113,52,26,11">--</text>

      </g>

      <!-- ================= SPLIT CONNECTION ================= -->

      <g id="split-link" data-nvp-widget="split_link">

            <rect x="140" y="52"
                  width="15" height="11"
                  fill="#000" />

            <g data-nvp-slot="connected"
                  data-nvp-bind="split.connected"
                  data-nvp-render="visible"
                  data-nvp-when="true"
                  data-nvp-bounds="140,52,15,11">

                  <text x="147.5" y="60"
                        text-anchor="middle"
                        font-family="monospace"
                        font-size="8"
                        font-weight="bold"
                        fill="#fff">OK</text>

            </g>

            <text x="147.5" y="60"
                  text-anchor="middle"
                  font-family="monospace"
                  font-size="8"
                  data-nvp-slot="connected"
                  data-nvp-bind="split.connected"
                  data-nvp-render="visible"
                  data-nvp-when="false"
                  fill="#fff"
                  data-nvp-bounds="140,52,15,11">NO</text>

      </g>

</svg>