<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="340"
     viewBox="0 0 160 68"
     shape-rendering="geometricPrecision">

      <title>ZMK SVG — Infograph Complications</title>

  <!-- ================= BACKGROUND ================= -->

  <rect width="160" height="68" fill="#fff"/>

  <!-- ================= LEFT BATTERY RING ================= -->

  <g id="battery-left" data-nvp-widget="battery">

    <!-- Background ring -->
    <circle cx="20" cy="23" r="17"
            fill="none"
            stroke="#ddd"
            stroke-width="3"/>

    <!-- Dynamic battery ring -->
    <circle cx="20" cy="23" r="17"
            fill="none"
            stroke="#000"
            stroke-width="3"
            stroke-linecap="round"
            transform="rotate(-90 20 23)"
            data-nvp-slot="level"
            data-nvp-bind="battery.left.percent"
            data-nvp-render="ring"/>

    <!-- Battery label -->
    <text x="20" y="18"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="6"
          font-weight="bold">LEFT</text>

    <!-- Battery percentage -->
    <text x="17" y="29"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="8"
          font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="percent">87%</text>

    <!-- Charging indicator inside ring -->
    <path d="M29 17
             L26 22
             H29
             L28 27
             L33 20
             H30
             L32 17Z"
          fill="#000"
          data-nvp-slot="charge"
          data-nvp-bind="battery.left.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="26,17,7,10"/>

  </g>

  <!-- ================= RIGHT BATTERY RING ================= -->

  <g id="battery-right" data-nvp-widget="battery">

    <!-- Background ring -->
    <circle cx="58" cy="23" r="17"
            fill="none"
            stroke="#ddd"
            stroke-width="3"/>

    <!-- Dynamic battery ring -->
    <circle cx="58" cy="23" r="17"
            fill="none"
            stroke="#000"
            stroke-width="3"
            stroke-linecap="round"
            transform="rotate(-90 58 23)"
            data-nvp-slot="level"
            data-nvp-bind="battery.right.percent"
            data-nvp-render="ring"/>

    <!-- Battery label -->
    <text x="58" y="18"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="6"
          font-weight="bold">RIGHT</text>

    <!-- Battery percentage -->
    <text x="55" y="29"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="8"
          font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="percent">64%</text>

    <!-- Charging indicator inside ring -->
    <path d="M67 17
             L64 22
             H67
             L66 27
             L71 20
             H68
             L70 17Z"
          fill="#000"
          data-nvp-slot="charge"
          data-nvp-bind="battery.right.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="64,17,7,10"/>

  </g>

  <!-- ================= LAYER COMPLICATION ================= -->

  <g id="layer-display" data-nvp-widget="layer">

    <circle cx="98" cy="23" r="19"
            fill="#000"/>

    <text x="98" y="15"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="6"
          font-weight="bold"
          fill="#fff">LAYER</text>

    <text x="98" y="34"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="24"
          font-weight="bold"
          fill="#fff"
          data-nvp-slot="value"
          data-nvp-bind="layer.index"
          data-nvp-render="text">0</text>

  </g>

  <!-- ================= HOST COMPLICATION ================= -->

  <g id="connection-status" data-nvp-widget="connection">

    <circle cx="140" cy="23" r="17"
            fill="none"
            stroke="#000"
            stroke-width="2"/>

    <!-- USB -->
    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="usb"
       data-nvp-bounds="125,16,30,14">

      <text x="140" y="27"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="10"
            font-weight="bold">USB</text>

    </g>

    <!-- Bluetooth -->
    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="ble"
       data-nvp-bounds="125,16,30,14">

      <text x="140" y="27"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="10"
            font-weight="bold">BLE</text>

    </g>

    <!-- Disconnected -->
    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="none"
       data-nvp-bounds="125,16,30,14">

      <text x="140" y="27"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="10"
            font-weight="bold">OFF</text>

    </g>

  </g>

  <!-- ================= BOTTOM PROFILE DOCK ================= -->

  <rect x="3" y="46"
        width="154" height="19"
        rx="9.5"
        fill="#000"/>

  <text x="11" y="58"
        font-family="sans-serif"
        font-size="7"
        font-weight="bold"
        fill="#fff">BT</text>

  <!-- ================= PROFILE 1 ================= -->

  <g id="profile-1" data-nvp-widget="profile_tile">

    <circle cx="37" cy="55.5" r="7" fill="#333"/>

    <text x="37" y="58"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="8">1</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="0"
       data-nvp-bounds="30,48.5,14,14">

      <circle cx="37" cy="55.5" r="7" fill="#fff"/>

      <text x="37" y="58"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="8">1</text>

    </g>

    <!-- Connected indicator -->
    <circle cx="42" cy="50.5" r="1.3"
            fill="#fff"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="0"
            data-nvp-bounds="40.5,49,3,3"/>

  </g>

  <!-- ================= PROFILE 2 ================= -->

  <g id="profile-2" data-nvp-widget="profile_tile">

    <circle cx="57" cy="55.5" r="7" fill="#333"/>

    <text x="57" y="58"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="8">2</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="1"
       data-nvp-bounds="50,48.5,14,14">

      <circle cx="57" cy="55.5" r="7" fill="#fff"/>

      <text x="57" y="58"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="8">2</text>

    </g>

    <circle cx="62" cy="50.5" r="1.3"
            fill="#fff"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="1"
            data-nvp-bounds="60.5,49,3,3"/>

  </g>

  <!-- ================= PROFILE 3 ================= -->

  <g id="profile-3" data-nvp-widget="profile_tile">

    <circle cx="77" cy="55.5" r="7" fill="#333"/>

    <text x="77" y="58"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="8">3</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="2"
       data-nvp-bounds="70,48.5,14,14">

      <circle cx="77" cy="55.5" r="7" fill="#fff"/>

      <text x="77" y="58"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="8">3</text>

    </g>

    <circle cx="82" cy="50.5" r="1.3"
            fill="#fff"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="2"
            data-nvp-bounds="80.5,49,3,3"/>

  </g>

  <!-- ================= PROFILE 4 ================= -->

  <g id="profile-4" data-nvp-widget="profile_tile">

    <circle cx="97" cy="55.5" r="7" fill="#333"/>

    <text x="97" y="58"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="8">4</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="3"
       data-nvp-bounds="90,48.5,14,14">

      <circle cx="97" cy="55.5" r="7" fill="#fff"/>

      <text x="97" y="58"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="8">4</text>

    </g>

    <circle cx="102" cy="50.5" r="1.3"
            fill="#fff"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="3"
            data-nvp-bounds="100.5,49,3,3"/>

  </g>

  <!-- ================= PROFILE 5 ================= -->

  <g id="profile-5" data-nvp-widget="profile_tile">

    <circle cx="117" cy="55.5" r="7" fill="#333"/>

    <text x="117" y="58"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="8">5</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="4"
       data-nvp-bounds="110,48.5,14,14">

      <circle cx="117" cy="55.5" r="7" fill="#fff"/>

      <text x="117" y="58"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="8">5</text>

    </g>

    <circle cx="122" cy="50.5" r="1.3"
            fill="#fff"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="4"
            data-nvp-bounds="120.5,49,3,3"/>

  </g>

  <!-- ================= SPLIT CONNECTION ================= -->

  <g id="split-link" data-nvp-widget="split_link">

    <text x="135" y="58"
          font-family="sans-serif"
          font-size="6"
          fill="#fff">S</text>

    <circle cx="147" cy="55.5" r="3"
            fill="#fff"
            data-nvp-slot="connected"
            data-nvp-bind="split.connected"
            data-nvp-render="visible"
            data-nvp-when="true"
            data-nvp-role="peripheral"
            data-nvp-bounds="144,52.5,6,6"/>

  </g>

</svg>
