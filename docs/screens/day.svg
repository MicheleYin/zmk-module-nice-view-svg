<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="340"
     viewBox="0 0 160 68"
     shape-rendering="crispEdges">

  <title>Nice!view Plus — Day, Large Widgets</title>

  <!-- ================= BACKGROUND ================= -->

  <rect width="160" height="68" fill="#fff"/>
 <!-- Sun -->
  <circle cx="92" cy="22" r="10" fill="#000"/>

  <g stroke="#000" stroke-width="1.5">
    <path d="M92 8V4
             M92 36V40
             M78 22H74
             M106 22H110
             M82 12L79 9
             M102 32L105 35
             M102 12L105 9
             M82 32L79 35"/>
  </g>


  <!-- Mountains -->
  <path d="M0 52L20 33L37 44L57 26L79 46L105 31L130 48L148 36L160 47V68H0Z"
        fill="#fff"
        stroke="#000"/>

  <path d="M0 63L25 46L45 57L70 42L96 59L123 44L160 61V68H0Z"
        fill="#000"/>

  <path d="M61 48L70 42L79 48M115 49L123 44L131 50"
        fill="none"
        stroke="#fff"/>

  <!-- ================= BATTERY PANEL ================= -->

  <rect x="2" y="2"
        width="77" height="28"
        rx="2"
        fill="#fff"
        stroke="#000"/>

  <!-- ================= LEFT BATTERY ================= -->

  <g id="battery-left" data-nvp-widget="battery">

    <!-- Left label -->
    <rect x="4" y="5"
          width="12" height="10"
          rx="1"
          fill="#000"/>

    <text x="10" y="13"
          text-anchor="middle"
          font-family="monospace"
          font-size="9"
          font-weight="bold"
          fill="#fff">L</text>

    <!-- Battery outline -->
    <rect x="19" y="5"
          width="25" height="10"
          rx="1"
          fill="none"
          stroke="#000"/>

    <!-- Terminal -->
    <rect x="44.5" y="8"
          width="2.5" height="4"
          fill="#000"/>

    <!-- Battery fill -->
    <rect x="22" y="8"
          width="19" height="4"
          fill="#000"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="bar"/>

    <!-- Charging icon inside battery -->
    <path d="M34 5
             L30 10
             H33
             L32 15
             L38 9
             H35
             L37 5Z"
          fill="#fff"
          stroke="#000"
          stroke-width=".6"
          data-nvp-slot="charge"
          data-nvp-bind="battery.left.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="30,5,8,10"/>

    <!-- Percentage -->
    <text x="51" y="14"
          font-family="monospace"
          font-size="11"
          font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="percent">87%</text>

  </g>

  <!-- ================= RIGHT BATTERY ================= -->

  <g id="battery-right" data-nvp-widget="battery">

    <!-- Right label -->
    <rect x="4" y="18"
          width="12" height="10"
          rx="1"
          fill="#000"/>

    <text x="10" y="26"
          text-anchor="middle"
          font-family="monospace"
          font-size="9"
          font-weight="bold"
          fill="#fff">R</text>

    <!-- Battery outline -->
    <rect x="19" y="18"
          width="25" height="10"
          rx="1"
          fill="none"
          stroke="#000"/>

    <!-- Terminal -->
    <rect x="44.5" y="21"
          width="2.5" height="4"
          fill="#000"/>

    <!-- Battery fill -->
    <rect x="22" y="21"
          width="19" height="4"
          fill="#000"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="bar"/>

    <!-- Charging icon inside battery -->
    <path d="M34 18
             L30 23
             H33
             L32 28
             L38 22
             H35
             L37 18Z"
          fill="#fff"
          stroke="#000"
          stroke-width=".6"
          data-nvp-slot="charge"
          data-nvp-bind="battery.right.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="30,18,8,10"/>

    <!-- Percentage -->
    <text x="51" y="27"
          font-family="monospace"
          font-size="11"
          font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="percent">64%</text>

  </g>

  <!-- ================= LAYER DISPLAY ================= -->

  <g id="layer-display" data-nvp-widget="layer">

    <rect x="124" y="2"
          width="34" height="28"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="141" y="10"
          text-anchor="middle"
          font-family="monospace"
          font-size="8"
          font-weight="bold">LAYER</text>

    <text x="141" y="27"
          text-anchor="middle"
          font-family="monospace"
          font-size="21"
          font-weight="bold"
          data-nvp-slot="value"
          data-nvp-bind="layer.index"
          data-nvp-render="text">0</text>

  </g>

  <!-- ================= BOTTOM STATUS PANEL ================= -->

  <rect x="2" y="49"
        width="75" height="17"
        rx="2"
        fill="#fff"
        stroke="#000"/>

  <g transform="translate(-18,0)">


  <!-- ================= BLE PROFILE 1 ================= -->

  <g id="ble-profile-1" data-nvp-widget="profile_tile">

    <rect x="23" y="51"
          width="13" height="13"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="29.5" y="61"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          font-weight="bold">1</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="0"
      data-nvp-bounds="5,51,13,13">

      <rect x="23" y="51"
            width="13" height="13"
            rx="2"
            fill="#000"/>

      <text x="29.5" y="61"
            text-anchor="middle"
            font-family="monospace"
            font-size="10"
            font-weight="bold"
            fill="#fff">1</text>

    </g>

    <circle cx="34" cy="53" r="2"
            fill="#fff"
            stroke="#000"
            stroke-width=".7"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="0"
            data-nvp-bounds="14,51,4,4"/>

  </g>

  <!-- ================= BLE PROFILE 2 ================= -->

  <g id="ble-profile-2" data-nvp-widget="profile_tile">

    <rect x="37" y="51"
          width="13" height="13"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="43.5" y="61"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          font-weight="bold">2</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="1"
      data-nvp-bounds="19,51,13,13">

      <rect x="37" y="51"
            width="13" height="13"
            rx="2"
            fill="#000"/>

      <text x="43.5" y="61"
            text-anchor="middle"
            font-family="monospace"
            font-size="10"
            font-weight="bold"
            fill="#fff">2</text>

    </g>

    <circle cx="48" cy="53" r="2"
            fill="#fff"
            stroke="#000"
            stroke-width=".7"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="1"
            data-nvp-bounds="28,51,4,4"/>

  </g>

  <!-- ================= BLE PROFILE 3 ================= -->

  <g id="ble-profile-3" data-nvp-widget="profile_tile">

    <rect x="51" y="51"
          width="13" height="13"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="57.5" y="61"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          font-weight="bold">3</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="2"
      data-nvp-bounds="33,51,13,13">

      <rect x="51" y="51"
            width="13" height="13"
            rx="2"
            fill="#000"/>

      <text x="57.5" y="61"
            text-anchor="middle"
            font-family="monospace"
            font-size="10"
            font-weight="bold"
            fill="#fff">3</text>

    </g>

    <circle cx="62" cy="53" r="2"
            fill="#fff"
            stroke="#000"
            stroke-width=".7"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="2"
            data-nvp-bounds="42,51,4,4"/>

  </g>

  <!-- ================= BLE PROFILE 4 ================= -->

  <g id="ble-profile-4" data-nvp-widget="profile_tile">

    <rect x="65" y="51"
          width="13" height="13"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="71.5" y="61"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          font-weight="bold">4</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="3"
      data-nvp-bounds="47,51,13,13">

      <rect x="65" y="51"
            width="13" height="13"
            rx="2"
            fill="#000"/>

      <text x="71.5" y="61"
            text-anchor="middle"
            font-family="monospace"
            font-size="10"
            font-weight="bold"
            fill="#fff">4</text>

    </g>

    <circle cx="76" cy="53" r="2"
            fill="#fff"
            stroke="#000"
            stroke-width=".7"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="3"
            data-nvp-bounds="56,51,4,4"/>

  </g>

  <!-- ================= BLE PROFILE 5 ================= -->

  <g id="ble-profile-5" data-nvp-widget="profile_tile">

    <rect x="79" y="51"
          width="13" height="13"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="85.5" y="61"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          font-weight="bold">5</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="4"
      data-nvp-bounds="61,51,13,13">

      <rect x="79" y="51"
            width="13" height="13"
            rx="2"
            fill="#000"/>

      <text x="85.5" y="61"
            text-anchor="middle"
            font-family="monospace"
            font-size="10"
            font-weight="bold"
            fill="#fff">5</text>

    </g>

    <circle cx="90" cy="53" r="2"
            fill="#fff"
            stroke="#000"
            stroke-width=".7"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="4"
            data-nvp-bounds="70,51,4,4"/>

  </g>
</g>

  <!-- ================= HOST STATUS ================= -->

  <g id="connection-status" data-nvp-widget="connection">

    <rect x="97" y="49"
          width="61" height="17"
          rx="2"
          fill="#fff"
          stroke="#000"/>

    <text x="101" y="60"
          font-family="monospace"
          font-size="10"
          font-weight="bold"
          data-nvp-slot="selected"
          data-nvp-bind="output.selected"
          data-nvp-render="text"
          data-nvp-format="output-label">USB</text>

  </g>

  <!-- ================= SPLIT CONNECTION ================= -->

  <g id="split-link" data-nvp-widget="split_link">

    <g data-nvp-slot="connected"
       data-nvp-bind="split.connected"
       data-nvp-render="visible"
       data-nvp-when="true"
       data-nvp-bounds="140,52,15,11">

      <rect x="140" y="52"
            width="15" height="11"
            rx="2"
            fill="#000"/>

      <text x="147.5" y="60"
            text-anchor="middle"
            font-family="monospace"
            font-size="8"
            font-weight="bold"
            fill="#fff">OK</text>

    </g>

    <text x="147.5" y="60"
          text-anchor="middle"
          font-family="monospace"
          font-size="8"
          data-nvp-slot="connected"
          data-nvp-bind="split.connected"
          data-nvp-render="visible"
          data-nvp-when="false"
          data-nvp-bounds="140,52,15,11">NO</text>

  </g>

</svg>