<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nice!view LVGL XML Live Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      color: #182421;
      background: #edf1ee;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      color: #f6f7f4;
      background: #182421;
      border-bottom: 3px solid #c5e27a;
    }
    .brand { font-size: 14px; font-weight: 700; }
    .source { color: #c4d0ca; font-size: 12px; overflow-wrap: anywhere; }
    .header-controls { display: flex; align-items: center; gap: 16px; }
    .role-control { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .role-control[hidden] { display: none; }
    select, input { font: inherit; }
    select {
      min-height: 32px;
      border: 1px solid #aab8b1;
      border-radius: 3px;
      padding: 4px 8px;
      color: #182421;
      background: #fff;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(290px, 370px);
      min-height: calc(100vh - 55px);
    }
    .stage {
      display: grid;
      align-content: start;
      justify-items: center;
      gap: 12px;
      padding: clamp(18px, 5vw, 64px);
      border-right: 1px solid #cbd4ce;
    }
    .screens {
      display: grid;
      gap: 20px;
      width: min(100%, 800px);
      justify-items: stretch;
    }
    .screens.both {
      grid-template-columns: 1fr 1fr;
      width: min(100%, 1100px);
    }
    .screen-panel { display: grid; gap: 8px; min-width: 0; }
    .screen-label {
      color: #53635c;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .screen {
      width: 100%;
      aspect-ratio: 160 / 68;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #35433d;
      background: #fff;
      box-shadow: 0 12px 28px #18242120;
    }
    .preview { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .screen-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      width: min(100%, 1100px);
      color: #53635c;
      font-size: 11px;
    }
    #status { color: #45632a; text-align: right; }
    @media (max-width: 900px) {
      .screens.both { grid-template-columns: 1fr; width: min(100%, 800px); }
    }
    aside { min-width: 0; background: #f8faf8; }
    .controls-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 15px 16px 12px;
      border-bottom: 1px solid #cbd4ce;
      background: #f8faf8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    #fields { max-height: calc(100vh - 102px); overflow: auto; }
    .field {
      display: grid;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e6e2;
    }
    .field.disabled { opacity: .45; }
    .field-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .field-name { font-size: 12px; overflow-wrap: anywhere; }
    .field-kind { color: #697870; font-size: 10px; white-space: nowrap; }
    .field-description { color: #53635c; font-size: 10px; line-height: 1.35; }
    .field input[type="text"], .field input[type="number"] {
      width: 100%;
      min-height: 32px;
      border: 1px solid #aab8b1;
      border-radius: 3px;
      padding: 5px 8px;
      background: #fff;
    }
    .range-row { display: grid; grid-template-columns: 1fr 54px; align-items: center; gap: 10px; }
    input[type="range"] { width: 100%; accent-color: #52752d; }
    .range-value, .mask-value { color: #53635c; font-size: 11px; text-align: right; }
    .toggle, .bit-toggle { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .toggle input, .bit-toggle input { accent-color: #52752d; }
    .bit-list { display: flex; flex-wrap: wrap; gap: 8px 12px; }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; padding: 10px 14px; }
      main { grid-template-columns: 1fr; }
      .stage { padding: 26px 14px; border-right: 0; border-bottom: 1px solid #cbd4ce; }
      #fields { max-height: none; }
      .controls-heading { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">NICE!VIEW / LIVE PREVIEW</div>
      <div class="source" id="source"></div>
    </div>
    <div class="header-controls">
      <label class="role-control" id="screen-control" hidden>Screen
        <select id="screen-select"></select>
      </label>
      <label class="role-control">Display role
        <select id="role">
          <option value="central">Central</option>
          <option value="peripheral">Peripheral</option>
          <option value="both">Both</option>
        </select>
      </label>
      <label class="role-control">Polarity
        <select id="inversion">
          <option value="legacy">Legacy</option>
          <option value="white-background">White background</option>
        </select>
      </label>
    </div>
  </header>
  <main>
    <section class="stage" aria-label="Raster preview">
      <div class="screens" id="screens">
        <div class="screen-panel" data-role="central">
          <div class="screen-label">Central</div>
          <div class="screen"><img class="preview" alt="Central Nice!view preview"></div>
        </div>
        <div class="screen-panel" data-role="peripheral" hidden>
          <div class="screen-label">Peripheral</div>
          <div class="screen"><img class="preview" alt="Peripheral Nice!view preview"></div>
        </div>
      </div>
      <div class="screen-meta"><span id="dimensions"></span><span id="status" aria-live="polite">Loading</span></div>
    </section>
    <aside>
      <div class="controls-heading">Bound status fields</div>
      <div id="fields"></div>
    </aside>
  </main>
  <script type="module">
    const roleSelect = document.querySelector("#role");
    const inversionSelect = document.querySelector("#inversion");
    const screenControl = document.querySelector("#screen-control");
    const screenSelect = document.querySelector("#screen-select");
    const fieldsRoot = document.querySelector("#fields");
    const screensRoot = document.querySelector("#screens");
    const status = document.querySelector("#status");
    const controlState = new Map();
    const activeUrls = new Map();
    let config;
    let requestController;
    let renderTimer;

    function selectedRoles() {
      if (config.paired) return ["left", "right"];
      return roleSelect.value === "both" ? ["central", "peripheral"] : [roleSelect.value];
    }

    function primaryRole() {
      if (config.paired) return config.panelRoles.left;
      return roleSelect.value === "both" ? "central" : roleSelect.value;
    }

    function rolesForField(field) {
      if (config.paired) return field.roles;
      if (roleSelect.value === "both") {
        return field.roles.filter(role => role === "central" || role === "peripheral");
      }
      return field.roles.includes(roleSelect.value) ? [roleSelect.value] : [];
    }

    function createEnumControl(field, editor, state) {
      const select = document.createElement("select");
      for (const value of field.values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.append(option);
      }
      state.controls = [select];
      state.read = () => select.value;
      state.write = value => { select.value = value; };
      editor.append(select);
    }

    function createBooleanControl(field, editor, state) {
      const label = document.createElement("label");
      label.className = "toggle";
      const input = document.createElement("input");
      input.type = "checkbox";
      label.append(input, document.createTextNode(field.control_label ?? "Enabled"));
      editor.append(label);
      state.controls = [input];
      state.read = () => input.checked;
      state.write = value => { input.checked = Boolean(value); };
    }

    function createBitmaskControl(field, editor, state) {
      const list = document.createElement("div");
      list.className = "bit-list";
      for (let bit = 0; bit < field.bits; bit++) {
        const label = document.createElement("label");
        label.className = "bit-toggle";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.bit = bit;
        label.append(input, document.createTextNode(`Profile ${bit + 1}`));
        list.append(label);
        state.controls.push(input);
      }
      editor.append(list);
      const mask = document.createElement("div");
      mask.className = "mask-value";
      editor.append(mask);
      state.read = () => state.controls.reduce(
        (value, input) => input.checked ? value | (1 << Number(input.dataset.bit)) : value,
        0,
      );
      state.write = value => {
        const bits = Number(value) || 0;
        for (const input of state.controls) {
          input.checked = Boolean(bits & (1 << Number(input.dataset.bit)));
        }
        mask.textContent = `Mask: ${bits}`;
      };
    }

    function createPercentControl(field, editor, state) {
      const line = document.createElement("div");
      line.className = "range-row";
      const input = document.createElement("input");
      input.type = "range";
      input.min = field.minimum ?? 0;
      input.max = field.maximum ?? 100;
      input.step = "1";
      const output = document.createElement("output");
      output.className = "range-value";
      line.append(input, output);
      editor.append(line);
      state.controls = [input];
      state.read = () => Number(input.value);
      state.write = value => {
        input.value = value ?? input.min;
        output.textContent = `${input.value}%`;
      };
      input.addEventListener("input", () => {
        output.textContent = `${input.value}%`;
        saveCurrentValue(state);
        queueRender();
      });
    }

    function createTextControl(field, editor, state) {
      const input = document.createElement("input");
      input.type = field.type === "string" ? "text" : "number";
      if (field.minimum !== undefined) input.min = field.minimum;
      if (field.maximum !== undefined) input.max = field.maximum;
      if (field.type === "integer") input.step = "1";
      editor.append(input);
      state.controls = [input];
      state.read = () => field.type === "string" ? input.value : Number(input.value);
      state.write = value => { input.value = value ?? ""; };
    }

    function fieldDescriptionText(field) {
      if (!field.role_descriptions) return "";
      if (roleSelect.value !== "both") {
        return field.role_descriptions[roleSelect.value] ?? "";
      }
      const parts = [];
      for (const role of field.roles) {
        const text = field.role_descriptions[role];
        if (text) parts.push(`${role}: ${text}`);
      }
      return parts.join(" · ");
    }

    function createField(field) {
      const row = document.createElement("section");
      row.className = "field";
      const heading = document.createElement("div");
      heading.className = "field-heading";
      const name = document.createElement("span");
      name.className = "field-name";
      name.textContent = field.id;
      const kind = document.createElement("span");
      kind.className = "field-kind";
      kind.textContent = `${field.type} · ${field.renderers.join(", ")}`;
      heading.append(name, kind);
      let description;
      if (field.role_descriptions) {
        description = document.createElement("div");
        description.className = "field-description";
        description.textContent = fieldDescriptionText(field);
      }
      const editor = document.createElement("div");
      if (description) row.append(heading, description, editor);
      else row.append(heading, editor);

      const state = {
        field,
        row,
        editor,
        description,
        controls: [],
        read: () => null,
        write: () => {},
      };
      const builders = {
        enum: createEnumControl,
        boolean: createBooleanControl,
        bitmask: createBitmaskControl,
        percent: createPercentControl,
        integer: createTextControl,
        string: createTextControl,
      };
      builders[field.type](field, editor, state);

      for (const input of state.controls) {
        input.addEventListener("change", () => {
          saveCurrentValue(state);
          if (field.type === "bitmask") state.write(state.read());
          queueRender();
        });
      }
      fieldsRoot.append(row);
      controlState.set(field.id, state);
      return state;
    }

    function saveCurrentValue(state) {
      const value = state.read();
      for (const role of rolesForField(state.field)) {
        config.values[role][state.field.id] = value;
      }
    }

    function syncControls() {
      for (const state of controlState.values()) {
        const roles = rolesForField(state.field);
        const available = roles.length > 0;
        state.row.classList.toggle("disabled", !available);
        for (const input of state.controls) input.disabled = !available;
        if (state.description) {
          state.description.textContent = fieldDescriptionText(state.field);
        }
        const sourceRole = roles.includes("central")
          ? "central"
          : (roles[0] ?? primaryRole());
        state.write(config.values[sourceRole][state.field.id]);
      }
      updateScreenLayout();
    }

    function updateScreenMetadata() {
      const panels = [...screensRoot.querySelectorAll(".screen-panel")];
      for (const panel of panels) {
        const panelConfig = config.paired
          ? config.screens[panel.dataset.role]
          : config;
        panel.querySelector(".screen").style.aspectRatio =
          `${panelConfig.width} / ${panelConfig.height}`;
      }
      document.querySelector("#dimensions").textContent = config.paired
        ? `Left ${config.screens.left.width} × ${config.screens.left.height} px · Right ${config.screens.right.width} × ${config.screens.right.height} px · 1-bit monochrome`
        : `${config.width} × ${config.height} px · 1-bit monochrome`;
    }

    async function refreshConfig() {
      const response = await fetch("/config", { cache: "no-store" });
      if (!response.ok) throw new Error(await response.text());
      const updated = await response.json();
      const previousValues = config.values;
      for (const role of ["central", "peripheral"]) {
        for (const [fieldId, value] of Object.entries(previousValues[role] ?? {})) {
          if (fieldId in updated.values[role]) updated.values[role][fieldId] = value;
        }
      }
      const bindingsChanged = JSON.stringify(config.bindings) !== JSON.stringify(updated.bindings);
      config = updated;
      await refreshScreenChoices();
      document.title = `${config.title} · Nice!view Live Preview`;
      document.querySelector("#source").textContent = config.title;
      if (bindingsChanged) {
        controlState.clear();
        fieldsRoot.replaceChildren();
        for (const field of config.bindings) createField(field);
      }
      updateScreenMetadata();
      syncControls();
      queueRender();
    }

    async function refreshScreenChoices() {
      try {
        const response = await fetch("/screens", { cache: "no-store" });
        if (!response.ok) return;
        const choices = await response.json();
        if (!choices.length) return;
        const current = config.screenChoice ?? screenSelect.value;
        screenSelect.replaceChildren(...choices.map(choice => {
          const option = document.createElement("option");
          option.value = choice.id;
          option.textContent = choice.label;
          return option;
        }));
        screenSelect.value = choices.some(choice => choice.id === current)
          ? current
          : choices[0].id;
        screenControl.hidden = false;
      } catch {}
    }

    async function selectScreen() {
      status.textContent = "Loading screen…";
      try {
        const response = await fetch("/screen", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: screenSelect.value }),
        });
        if (!response.ok) throw new Error(await response.text());
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function updateScreenLayout() {
      const both = config.paired || roleSelect.value === "both";
      screensRoot.classList.toggle("both", both);
      for (const panel of screensRoot.querySelectorAll(".screen-panel")) {
        const role = panel.dataset.role;
        panel.hidden = config.paired ? false : !(both || role === roleSelect.value);
      }
    }

    function updateScreenPolarity() {
      const inverted = inversionSelect.value === "legacy" && config.legacyInverted;
      for (const screen of screensRoot.querySelectorAll(".screen")) {
        screen.style.background = inverted ? "#000" : "#fff";
      }
      queueRender();
    }

    function queueRender() {
      clearTimeout(renderTimer);
      status.textContent = "Rendering…";
      renderTimer = setTimeout(renderPreview, 90);
    }

    async function renderRole(panelName, signal) {
      const role = config.paired ? config.panelRoles[panelName] : panelName;
      const response = await fetch("/render", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          panel: config.paired ? panelName : undefined,
          role,
          values: config.values[role],
          inversionMode: inversionSelect.value,
        }),
        signal,
      });
      if (!response.ok) throw new Error(await response.text());
      return URL.createObjectURL(await response.blob());
    }

    async function renderPreview() {
      requestController?.abort();
      requestController = new AbortController();
      const roles = selectedRoles();
      try {
        const urls = await Promise.all(
          roles.map(role => renderRole(role, requestController.signal)),
        );
        for (let index = 0; index < roles.length; index++) {
          const panelName = roles[index];
          const panel = screensRoot.querySelector(`.screen-panel[data-role="${panelName}"]`);
          const image = panel.querySelector(".preview");
          image.src = urls[index];
          const screenConfig = config.paired ? config.screens[panelName] : config;
          image.width = screenConfig.width;
          image.height = screenConfig.height;
          const previous = activeUrls.get(panelName);
          if (previous) URL.revokeObjectURL(previous);
          activeUrls.set(panelName, urls[index]);
        }
        status.textContent = "Ready";
      } catch (error) {
        if (error.name !== "AbortError") status.textContent = error.message;
      }
    }

    async function start() {
      const response = await fetch("/config");
      if (!response.ok) throw new Error(await response.text());
      config = await response.json();
      await refreshScreenChoices();
      document.title = `${config.title} · Nice!view Live Preview`;
      document.querySelector("#source").textContent = config.title;
      const panels = [...screensRoot.querySelectorAll(".screen-panel")];
      if (config.paired) {
        roleSelect.closest("label").hidden = true;
        panels[0].dataset.role = "left";
        panels[1].dataset.role = "right";
        panels[0].querySelector(".screen-label").textContent = "Left";
        panels[1].querySelector(".screen-label").textContent = "Right";
        panels[0].querySelector(".preview").alt = "Left screen preview";
        panels[1].querySelector(".preview").alt = "Right screen preview";
        roleSelect.value = "both";
        roleSelect.disabled = true;
      }
      updateScreenMetadata();
      inversionSelect.value = config.initialInversionMode;
      screenSelect.addEventListener("change", selectScreen);
      inversionSelect.addEventListener("change", updateScreenPolarity);
      updateScreenPolarity();
      roleSelect.value = config.initialRole;
      for (const field of config.bindings) createField(field);
      roleSelect.addEventListener("change", () => { syncControls(); queueRender(); });
      syncControls();
      renderPreview();
      const events = new EventSource("/events");
      events.addEventListener("change", async event => {
        const change = JSON.parse(event.data);
        if (change.error) {
          status.textContent = `Source error: ${change.error}`;
          return;
        }
        try {
          await refreshConfig();
        } catch (error) {
          status.textContent = error.message;
        }
      });
      events.onerror = () => { status.textContent = "Reconnecting to live preview…"; };
    }

    try {
      await start();
    } catch (error) {
      status.textContent = error.message;
    }
  </script>
</body>
</html>
