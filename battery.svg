<svg xmlns="http://www.w3.org/2000/svg"
     width="42" height="20" viewBox="0 0 42 20"
     shape-rendering="crispEdges">

  <g fill="none"
     stroke="currentColor"
     stroke-width="1.5">

    <!-- Battery body -->
    <rect x="1" y="4" width="27" height="12" rx="1"/>

    <!-- Battery terminal -->
    <rect x="29" y="8" width="3" height="4"
          fill="currentColor" stroke="none"/>

    <!-- Battery fill: adjust width to percentage -->
    <rect x="4" y="7" width="18" height="6"
          fill="currentColor" stroke="none"/>

  </g>

  <!-- Percentage -->
  <text x="35" y="7"
        font-family="monospace"
        font-size="7"
        fill="currentColor">80</text>

  <text x="35" y="16"
        font-family="monospace"
        font-size="7"
        fill="currentColor">%</text>

</svg>