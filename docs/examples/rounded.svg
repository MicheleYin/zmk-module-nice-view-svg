<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="340"
     viewBox="0 0 160 68"
     shape-rendering="geometricPrecision">

  <title>Nice!view Plus — Soft UI</title>

  <!-- ================= BACKGROUND ================= -->

  <rect width="160" height="68" fill="#fff"/>

  <!-- ================= LEFT BATTERY ================= -->

  <g id="battery-left" data-nvp-widget="battery">

    <!-- Rounded battery card -->
    <rect x="2" y="2" width="49" height="29"
          rx="7" fill="#000"/>

    <text x="9" y="18"
          font-family="sans-serif"
          font-size="13"
          font-weight="bold"
          fill="#fff"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="percent">87%</text>

    <rect x="9" y="22" width="29" height="5"
          rx="1.25" fill="#fff"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="bar"/>

    <!-- Charging icon -->
    <path d="M39 8L35 15H39L37 21L45 12H41L43 8Z"
          fill="#fff"
          data-nvp-slot="charge"
          data-nvp-bind="battery.left.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="35,8,10,13"/>

  </g>

  <!-- ================= RIGHT BATTERY ================= -->

  <g id="battery-right" data-nvp-widget="battery">

    <rect x="2" y="34" width="49" height="29"
          rx="7" fill="#fff" stroke="#000"/>

    <text x="9" y="50"
          font-family="sans-serif"
          font-size="13"
          font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="percent">64%</text>
    <rect x="9" y="54" width="29" height="5"
          rx="1.25" fill="#000"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="bar"/>

  </g>

  <!-- ================= LAYER ================= -->

  <g id="layer-display" data-nvp-widget="layer">

    <!-- Central pill -->
    <rect x="55" y="2" width="49" height="61"
          rx="12" fill="#fff" stroke="#000"/>

    <text x="79.5" y="13"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="7"
          font-weight="bold">LAYER</text>

    <!-- Large layer number -->
    <text x="79.5" y="47"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="39"
          font-weight="bold"
          data-nvp-slot="value"
          data-nvp-bind="layer.index"
          data-nvp-render="text">0</text>

    <!-- Small decorative indicator -->
    <rect x="71" y="54" width="17" height="3"
          rx="1.5" fill="#000"/>

  </g>

  <!-- ================= HOST ================= -->

  <g id="connection-status" data-nvp-widget="connection">

    <rect x="108" y="2" width="50" height="19"
          rx="9" fill="#000"/>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="usb"
       data-nvp-bounds="108,2,50,19">

      <text x="133" y="16"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="14"
            font-weight="bold"
            fill="#fff">USB</text>

    </g>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="ble"
       data-nvp-bounds="108,2,50,19">

      <text x="133" y="16"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="14"
            font-weight="bold"
            fill="#fff">BLE</text>

    </g>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="none"
       data-nvp-bounds="108,2,50,19">

      <text x="133" y="16"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="14"
            font-weight="bold"
            fill="#fff">OFF</text>

    </g>

  </g>

  <!-- ================= BLE PROFILE SELECTOR ================= -->

  <!-- <rect x="108" y="24" width="50" height="25"
        rx="8" fill="#fff" stroke="#000"/> -->

  <!-- PROFILE 1 -->
  <g id="profile-1" data-nvp-widget="profile_tile">

    <circle cx="116" cy="35" r="5.5"
            fill="#fff" stroke="#000"/>

    <text x="116" y="39"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="12">1</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="0"
       data-nvp-bounds="111,36,10,10">

      <circle cx="116" cy="35" r="5.5" fill="#000"/>

      <text x="116" y="39"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="12"
            fill="#fff">1</text>

    </g>

    <circle cx="119" cy="27" r="1"
            fill="#000"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="0"
            data-nvp-bounds="118,36,2,2"/>

  </g>

  <!-- PROFILE 2 -->
  <g id="profile-2" data-nvp-widget="profile_tile">

    <circle cx="125" cy="35" r="5.5"
            fill="#fff" stroke="#000"/>

    <text x="125" y="39"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="12">2</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="1"
       data-nvp-bounds="120,36,10,10">

      <circle cx="125" cy="35" r="5.5" fill="#000"/>

      <text x="125" y="39"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="12"
            fill="#fff">2</text>

    </g>

    <circle cx="128" cy="27" r="1"
            fill="#000"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="1"
            data-nvp-bounds="127,36,2,2"/>

  </g>

  <!-- PROFILE 3 -->
  <g id="profile-3" data-nvp-widget="profile_tile">

    <circle cx="134" cy="35" r="5.5"
            fill="#fff" stroke="#000"/>

    <text x="134" y="39"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="12">3</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="2"
       data-nvp-bounds="129,36,10,10">

      <circle cx="134" cy="35" r="5.5" fill="#000"/>

      <text x="134" y="39"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="12"
            fill="#fff">3</text>

    </g>

    <circle cx="137" cy="27" r="1"
            fill="#000"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="2"
            data-nvp-bounds="136,36,2,2"/>

  </g>

  <!-- PROFILE 4 -->
  <g id="profile-4" data-nvp-widget="profile_tile">

    <circle cx="143" cy="35" r="5.5"
            fill="#fff" stroke="#000"/>

    <text x="143" y="39"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="12">4</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="3"
       data-nvp-bounds="138,36,10,10">

      <circle cx="143" cy="35" r="5.5" fill="#000"/>

      <text x="143" y="39"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="12"
            fill="#fff">4</text>

    </g>

    <circle cx="146" cy="27" r="1"
            fill="#000"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="3"
            data-nvp-bounds="145,36,2,2"/>

  </g>

  <!-- PROFILE 5 -->
  <g id="profile-5" data-nvp-widget="profile_tile">

    <circle cx="152" cy="35" r="5.5"
            fill="#fff" stroke="#000"/>

    <text x="152" y="39"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="12">5</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="4"
       data-nvp-bounds="147,36,10,10">

      <circle cx="152" cy="35" r="5.5" fill="#000"/>

      <text x="152" y="39"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="12"
            fill="#fff">5</text>

    </g>

    <circle cx="155" cy="27" r="1"
            fill="#000"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="4"
            data-nvp-bounds="154,36,2,2"/>

  </g>

</svg>