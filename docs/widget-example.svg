<svg xmlns="http://www.w3.org/2000/svg"
     width="160" height="68"
     viewBox="0 0 160 68"
     shape-rendering="crispEdges">
  <title>Widget authoring example</title>
  <rect width="160" height="68" fill="#fff"/>

  <g id="battery-central" data-nvp-widget="battery">
    <rect x="4" y="5" width="28" height="11" fill="none" stroke="#000"/>
    <rect x="32" y="8" width="2" height="5" fill="#000"/>
    <rect x="7" y="8" width="21" height="5" fill="#000"
          data-nvp-slot="level"
          data-nvp-bind="battery.central.percent"
          data-nvp-render="bar"/>
    <text x="39" y="14" font-family="monospace" font-size="9"
          data-nvp-slot="level"
          data-nvp-bind="battery.central.percent"
          data-nvp-render="percent">87%</text>
    <path d="M20 6L16 10H19L18 14L24 9H21L23 6Z"
          fill="#fff" stroke="#000"
          data-nvp-slot="charge"
          data-nvp-bind="battery.central.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="15,5,9,9"/>
  </g>

  <g id="layer-display" data-nvp-widget="layer">
    <rect x="116" y="3" width="40" height="25" fill="none" stroke="#000"/>
    <text x="136" y="12" text-anchor="middle"
          font-family="monospace" font-size="6">LAYER</text>
    <text x="136" y="25" text-anchor="middle"
          font-family="monospace" font-size="15" font-weight="bold"
          data-nvp-slot="value"
          data-nvp-bind="layer.index"
          data-nvp-render="text">0</text>
  </g>

  <g id="connection-status" data-nvp-widget="connection">
    <g data-nvp-slot="selected" data-nvp-bind="output.selected"
             data-nvp-render="visible" data-nvp-when="usb"
             data-nvp-bounds="4,48,43,15">
      <rect x="4" y="48" width="43" height="15" fill="#000"/>
      <text x="25" y="59" text-anchor="middle" fill="#fff"
            font-family="monospace" font-size="8">USB</text>
    </g>
    <g data-nvp-slot="selected" data-nvp-bind="output.selected"
             data-nvp-render="visible" data-nvp-when="ble"
             data-nvp-bounds="4,48,43,15">
      <rect x="4" y="48" width="43" height="15" fill="#000"/>
      <text x="25" y="59" text-anchor="middle" fill="#fff"
            font-family="monospace" font-size="8">BLE</text>
    </g>
    <g data-nvp-slot="selected" data-nvp-bind="output.selected"
             data-nvp-render="visible" data-nvp-when="none"
             data-nvp-bounds="4,48,43,15">
      <rect x="4" y="48" width="43" height="15" fill="#fff" stroke="#000"/>
      <text x="25" y="59" text-anchor="middle"
            font-family="monospace" font-size="8">--</text>
    </g>
  </g>

  <g id="active-profile-1" data-nvp-widget="profile_tile">
    <rect x="60" y="48" width="15" height="15" fill="#fff" stroke="#000"/>
    <rect x="60" y="48" width="15" height="15" fill="#000"
          data-nvp-slot="active"
          data-nvp-bind="ble.active_profile"
          data-nvp-render="visible"
          data-nvp-when="0"/>
    <text x="67.5" y="59" text-anchor="middle"
          font-family="monospace" font-size="8"
          data-nvp-slot="active"
          data-nvp-bind="ble.active_profile"
          data-nvp-render="visible"
          data-nvp-bounds="60,48,15,15"
          data-nvp-when="0">1</text>
  </g>
</svg>
