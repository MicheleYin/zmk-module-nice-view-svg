<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="340"
     viewBox="0 0 160 68"
     shape-rendering="geometricPrecision">

  <title>Modular Watch Face</title>
  <rect width="160" height="68" fill="#000"/>

  <!-- LEFT: BATTERY COMPLICATIONS -->

  <g id="battery-left" data-nvp-widget="battery">
    <text x="7" y="10" fill="#aaa" font-family="sans-serif"
          font-size="10" font-weight="bold">LEFT</text>
    <text x="7" y="24" fill="#fff" font-family="sans-serif"
          font-size="16" font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="percent">87%</text>

    <rect x="7" y="28" width="43" height="3" rx="1.5" fill="#444"/>
    <rect x="7" y="28" width="37" height="3" rx="1.5" fill="#fff"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="bar"/>

    <path d="M45 7L41 13H44L43 18L49 11H46L48 7Z"
          fill="#fff"
          data-nvp-slot="charge"
          data-nvp-bind="battery.left.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="41,7,8,11"/>
  </g>

  <g id="battery-right" data-nvp-widget="battery">
    <text x="7" y="43" fill="#aaa" font-family="sans-serif"
          font-size="10" font-weight="bold">RIGHT</text>
    <text x="7" y="57" fill="#fff" font-family="sans-serif"
          font-size="16" font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="percent">64%</text>

    <rect x="7" y="61" width="43" height="3" rx="1.5" fill="#444"/>
    <rect x="7" y="61" width="37" height="3" rx="1.5" fill="#fff"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="bar"/>

    <path d="M45 54L41 60H44L43 65L49 58H46L48 54Z"
          fill="#fff"
          data-nvp-slot="charge"
          data-nvp-bind="battery.right.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="41,54,8,11"/>
  </g>

  <!-- CENTER: CIRCULAR LAYER COMPLICATION -->

  <g id="layer-display" data-nvp-widget="layer">
    <circle cx="82" cy="34" r="29"
            fill="none" stroke="#444" stroke-width="4"/>

<circle cx="82" cy="34" r="29"
        fill="none"
        stroke="#fff"
        stroke-width="4"/>

    <text x="82" y="26" text-anchor="middle"
          font-family="sans-serif" font-size="12"
          font-weight="bold" fill="#aaa">LAYER</text>

    <text x="82" y="48" text-anchor="middle"
          font-family="sans-serif" font-size="29"
          font-weight="bold" fill="#fff"
          data-nvp-slot="value"
          data-nvp-bind="layer.index"
          data-nvp-render="text">0</text>
  </g>

  <!-- RIGHT: HOST -->

  <g id="connection-status" data-nvp-widget="connection">
    <rect x="118" y="5" width="37" height="17"
          rx="8.5" fill="#fff"/>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="usb"
       data-nvp-bounds="118,5,37,17">
      <text x="136.5" y="16" text-anchor="middle"
            font-family="sans-serif" font-size="10"
            font-weight="bold">USB</text>
    </g>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="ble"
       data-nvp-bounds="118,5,37,17">
      <text x="136.5" y="16" text-anchor="middle"
            font-family="sans-serif" font-size="10"
            font-weight="bold">BLE</text>
    </g>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="none"
       data-nvp-bounds="118,5,37,17">
      <text x="136.5" y="16" text-anchor="middle"
            font-family="sans-serif" font-size="10"
            font-weight="bold">OFF</text>
    </g>
  </g>

  <!-- RIGHT: BLE PROFILES -->


  <g id="profile-1" data-nvp-widget="profile_tile">
    <circle cx="121" cy="42" r="6" fill="#222"/>
    <text x="121" y="44" text-anchor="middle" fill="#fff"
          font-family="sans-serif" font-size="9">1</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="0"
       data-nvp-bounds="115,36,12,12">
      <circle cx="121" cy="42" r="6" fill="#fff"/>
      <text x="121" y="44" text-anchor="middle" fill="#000"
            font-family="sans-serif" font-size="9">1</text>
    </g>
    <circle cx="125" cy="38" r="1.2" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="0" data-nvp-bounds="123,36,4,4"/>
  </g>

  <g id="profile-2" data-nvp-widget="profile_tile">
    <circle cx="136" cy="42" r="6" fill="#222"/>
    <text x="136" y="44" text-anchor="middle" fill="#fff"
          font-family="sans-serif" font-size="9">2</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="1"
       data-nvp-bounds="130,36,12,12">
      <circle cx="136" cy="42" r="6" fill="#fff"/>
      <text x="136" y="44" text-anchor="middle" fill="#000"
            font-family="sans-serif" font-size="9">2</text>
    </g>
    <circle cx="140" cy="38" r="1.2" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="1" data-nvp-bounds="138,36,4,4"/>
  </g>

  <g id="profile-3" data-nvp-widget="profile_tile">
    <circle cx="151" cy="42" r="6" fill="#222"/>
    <text x="151" y="44" text-anchor="middle" fill="#fff"
          font-family="sans-serif" font-size="9">3</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="2"
       data-nvp-bounds="145,36,12,12">
      <circle cx="151" cy="42" r="6" fill="#fff"/>
      <text x="151" y="44" text-anchor="middle" fill="#000"
            font-family="sans-serif" font-size="9">3</text>
    </g>
    <circle cx="155" cy="38" r="1.2" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="2" data-nvp-bounds="153,36,4,4"/>
  </g>

  <g id="profile-4" data-nvp-widget="profile_tile">
    <circle cx="128.5" cy="57" r="6" fill="#222"/>
    <text x="128.5" y="59" text-anchor="middle" fill="#fff"
          font-family="sans-serif" font-size="9">4</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="3"
       data-nvp-bounds="122.5,51,12,12">
      <circle cx="128.5" cy="57" r="6" fill="#fff"/>
      <text x="128.5" y="59" text-anchor="middle" fill="#000"
            font-family="sans-serif" font-size="9">4</text>
    </g>
    <circle cx="132.5" cy="53" r="1.2" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="3" data-nvp-bounds="130.5,51,4,4"/>
  </g>

  <g id="profile-5" data-nvp-widget="profile_tile">
    <circle cx="143.5" cy="57" r="6" fill="#222"/>
    <text x="143.5" y="59" text-anchor="middle" fill="#fff"
          font-family="sans-serif" font-size="9">5</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="4"
       data-nvp-bounds="137.5,51,12,12">
      <circle cx="143.5" cy="57" r="6" fill="#fff"/>
      <text x="143.5" y="59" text-anchor="middle" fill="#000"
            font-family="sans-serif" font-size="9">5</text>
    </g>
    <circle cx="147.5" cy="53" r="1.2" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="4" data-nvp-bounds="145.5,51,4,4"/>
  </g>

  <g id="split-link" data-nvp-widget="split_link">
    <circle cx="154" cy="63" r="2" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="split.connected"
            data-nvp-render="visible" data-nvp-when="true"
            data-nvp-role="peripheral" data-nvp-bounds="152,61,4,4"/>
  </g>

</svg>