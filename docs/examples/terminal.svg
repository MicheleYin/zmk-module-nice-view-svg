<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340"
     viewBox="0 0 160 68" shape-rendering="crispEdges">
  <title>Concept 2 — Terminal</title>
  <rect width="160" height="68" fill="#000"/>

  <g fill="#fff" font-family="monospace">
    <text x="4" y="9" font-size="7" font-weight="bold">ZMK://STATUS</text>
    <text x="4" y="20" font-size="7">BAT.L</text>
    <text x="4" y="31" font-size="7">BAT.R</text>
    <text x="4" y="42" font-size="7">OUTPUT</text>
    <text x="4" y="53" font-size="7">PROFILE</text>
  </g>
  <path d="M4 12H156" stroke="#fff"/>

  <g id="battery-left" data-nvp-widget="battery">
    <text x="50" y="20" fill="#fff" font-family="monospace" font-size="8"
          data-nvp-slot="level" data-nvp-bind="battery.left.percent"
          data-nvp-render="percent">87%</text>
    <rect x="79" y="15" width="35" height="6" fill="none" stroke="#fff"/>
    <rect x="81" y="17" width="29" height="2" fill="#fff"
          data-nvp-slot="level" data-nvp-bind="battery.left.percent"
          data-nvp-render="bar"/>
    <text x="118" y="20" fill="#fff" font-family="monospace" font-size="8"
          data-nvp-slot="charge" data-nvp-bind="battery.left.charge"
          data-nvp-render="visible" data-nvp-when="charging"
          data-nvp-bounds="117,13,8,9">+</text>
  </g>

  <g id="battery-right" data-nvp-widget="battery">
    <text x="50" y="31" fill="#fff" font-family="monospace" font-size="8"
          data-nvp-slot="level" data-nvp-bind="battery.right.percent"
          data-nvp-render="percent">64%</text>
    <rect x="79" y="26" width="35" height="6" fill="none" stroke="#fff"/>
    <rect x="81" y="28" width="21" height="2" fill="#fff"
          data-nvp-slot="level" data-nvp-bind="battery.right.percent"
          data-nvp-render="bar"/>
  </g>

  <g id="layer-display" data-nvp-widget="layer">
    <rect x="133" y="14" width="23" height="26" fill="#fff"/>
    <text x="144.5" y="20" text-anchor="middle" font-family="monospace"
          font-size="5" fill="#000">LYR</text>
    <text x="144.5" y="36" text-anchor="middle" font-family="monospace"
          font-size="19" font-weight="bold" fill="#000"
          data-nvp-slot="value" data-nvp-bind="layer.index"
          data-nvp-render="text">0</text>
  </g>

  <g id="connection-status" data-nvp-widget="connection">
    <g data-nvp-slot="selected" data-nvp-bind="output.selected"
       data-nvp-render="visible" data-nvp-when="usb"
       data-nvp-bounds="50,35,29,9">
      <text x="50" y="42" font-family="monospace" font-size="8"
            fill="#fff">USB</text>
    </g>
    <g data-nvp-slot="selected" data-nvp-bind="output.selected"
       data-nvp-render="visible" data-nvp-when="ble"
       data-nvp-bounds="50,35,29,9">
      <text x="50" y="42" font-family="monospace" font-size="8"
            fill="#fff">BLE</text>
    </g>
    <g data-nvp-slot="selected" data-nvp-bind="output.selected"
       data-nvp-render="visible" data-nvp-when="none"
       data-nvp-bounds="50,35,29,9">
      <text x="50" y="42" font-family="monospace" font-size="8"
            fill="#fff">---</text>
    </g>
  </g>

  <g id="profile-1" data-nvp-widget="profile_tile">
    <rect x="51" y="46" width="13" height="10" fill="none" stroke="#fff"/>
    <text x="57.5" y="53" text-anchor="middle" fill="#fff"
          font-family="monospace" font-size="7">1</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="0" data-nvp-bounds="51,46,13,10">
      <rect x="51" y="46" width="13" height="10" fill="#fff"/>
      <text x="57.5" y="53" text-anchor="middle" fill="#000"
            font-family="monospace" font-size="7">1</text>
    </g>
    <circle cx="62" cy="48" r="1" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="0" data-nvp-bounds="61,47,2,2"/>
  </g>

  <g id="profile-2" data-nvp-widget="profile_tile">
    <rect x="68" y="46" width="13" height="10" fill="none" stroke="#fff"/>
    <text x="74.5" y="53" text-anchor="middle" fill="#fff"
          font-family="monospace" font-size="7">2</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="1" data-nvp-bounds="68,46,13,10">
      <rect x="68" y="46" width="13" height="10" fill="#fff"/>
      <text x="74.5" y="53" text-anchor="middle" fill="#000"
            font-family="monospace" font-size="7">2</text>
    </g>
    <circle cx="79" cy="48" r="1" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="1" data-nvp-bounds="78,47,2,2"/>
  </g>

  <g id="profile-3" data-nvp-widget="profile_tile">
    <rect x="85" y="46" width="13" height="10" fill="none" stroke="#fff"/>
    <text x="91.5" y="53" text-anchor="middle" fill="#fff"
          font-family="monospace" font-size="7">3</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="2" data-nvp-bounds="85,46,13,10">
      <rect x="85" y="46" width="13" height="10" fill="#fff"/>
      <text x="91.5" y="53" text-anchor="middle" fill="#000"
            font-family="monospace" font-size="7">3</text>
    </g>
    <circle cx="96" cy="48" r="1" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="2" data-nvp-bounds="95,47,2,2"/>
  </g>

  <g id="profile-4" data-nvp-widget="profile_tile">
    <rect x="102" y="46" width="13" height="10" fill="none" stroke="#fff"/>
    <text x="108.5" y="53" text-anchor="middle" fill="#fff"
          font-family="monospace" font-size="7">4</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="3" data-nvp-bounds="102,46,13,10">
      <rect x="102" y="46" width="13" height="10" fill="#fff"/>
      <text x="108.5" y="53" text-anchor="middle" fill="#000"
            font-family="monospace" font-size="7">4</text>
    </g>
    <circle cx="113" cy="48" r="1" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="3" data-nvp-bounds="112,47,2,2"/>
  </g>

  <g id="profile-5" data-nvp-widget="profile_tile">
    <rect x="119" y="46" width="13" height="10" fill="none" stroke="#fff"/>
    <text x="125.5" y="53" text-anchor="middle" fill="#fff"
          font-family="monospace" font-size="7">5</text>
    <g data-nvp-slot="active" data-nvp-bind="ble.active_profile"
       data-nvp-render="visible" data-nvp-when="4" data-nvp-bounds="119,46,13,10">
      <rect x="119" y="46" width="13" height="10" fill="#fff"/>
      <text x="125.5" y="53" text-anchor="middle" fill="#000"
            font-family="monospace" font-size="7">5</text>
    </g>
    <circle cx="130" cy="48" r="1" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible" data-nvp-when="set"
            data-nvp-bit="4" data-nvp-bounds="129,47,2,2"/>
  </g>

  <path d="M4 59H156" stroke="#fff"/>
  <text x="4" y="66" fill="#fff" font-family="monospace"
        font-size="6">SYSTEM READY</text>

  <g id="split-link" data-nvp-widget="split_link">
    <text x="128" y="66" fill="#fff" font-family="monospace" font-size="6">SPLIT</text>
    <circle cx="153" cy="64" r="2" fill="#fff"
            data-nvp-slot="connected" data-nvp-bind="split.connected"
            data-nvp-render="visible" data-nvp-when="true"
            data-nvp-role="peripheral" data-nvp-bounds="151,62,4,4"/>
  </g>
</svg>