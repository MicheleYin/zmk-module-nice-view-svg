<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="340"
     viewBox="0 0 160 68"
     shape-rendering="crispEdges">

  <title>Sofle - Minimal Default Status</title>
  <rect width="160" height="68" fill="#fff"/>

  <!-- LEFT BATTERY -->
  <g id="battery-left" data-nvp-widget="battery">
    <text x="4" y="13"
          font-family="monospace"
          font-size="11"
          font-weight="bold">L</text>

    <rect x="19.5" y="4.5" width="21" height="9"
          rx="1" fill="none" stroke="#000"/>

    <rect x="41" y="7" width="2" height="4"/>

    <rect x="22" y="7" width="15" height="4"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="bar"/>

    <path d="M31 4L27 9H30L29 14L35 8H32L34 4Z"
          fill="#fff" stroke="#000" stroke-width=".6"
          data-nvp-slot="charge"
          data-nvp-bind="battery.left.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="27,4,8,10"/>

    <text x="48" y="13"
          font-family="monospace"
          font-size="11"
          font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.left.percent"
          data-nvp-render="percent">87%</text>
  </g>

  <!-- RIGHT BATTERY -->
  <g id="battery-right" data-nvp-widget="battery">
    <text x="4" y="28"
          font-family="monospace"
          font-size="11"
          font-weight="bold">R</text>

    <rect x="19.5" y="19.5" width="21" height="9"
          rx="1" fill="none" stroke="#000"/>

    <rect x="41" y="22" width="2" height="4"/>

    <rect x="22" y="22" width="15" height="4"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="bar"/>

    <path d="M31 19L27 24H30L29 29L35 23H32L34 19Z"
          fill="#fff" stroke="#000" stroke-width=".6"
          data-nvp-slot="charge"
          data-nvp-bind="battery.right.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="27,19,8,10"/>

    <text x="48" y="28"
          font-family="monospace"
          font-size="11"
          font-weight="bold"
          data-nvp-slot="level"
          data-nvp-bind="battery.right.percent"
          data-nvp-render="percent">64%</text>
  </g>

  <!-- LAYER -->
  <g id="layer-display" data-nvp-widget="layer">
    <text x="130" y="11"
          text-anchor="middle"
          font-family="monospace"
          font-size="9"
          font-weight="bold">LAYER</text>

    <text x="130" y="31"
          text-anchor="middle"
          font-family="monospace"
          font-size="26"
          font-weight="bold"
          data-nvp-slot="value"
          data-nvp-bind="layer.index"
          data-nvp-render="text">0</text>
  </g>

  <!-- DIVIDER -->
  <path d="M3 34H157" stroke="#000" stroke-width="1"/>

  <!-- BLE LABEL -->
  <text x="3" y="47"
        font-family="monospace"
        font-size="10"
        font-weight="bold">BLE</text>

  <!-- BLE PROFILE 1 -->
  <g id="ble-profile-1" data-nvp-widget="profile_tile">
    <rect x="35" y="37" width="19" height="15"
          rx="2" fill="#fff" stroke="#000"/>

    <text x="44.5" y="49"
          text-anchor="middle"
          font-family="monospace"
          font-size="12"
          font-weight="bold">1</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="0"
       data-nvp-bounds="35,37,19,15">

      <rect x="35" y="37" width="19" height="15"
            rx="4" fill="#000"/>

      <text x="44.5" y="49"
            text-anchor="middle"
            font-family="monospace"
            font-size="12"
            font-weight="bold"
            fill="#fff">1</text>
    </g>

    <circle cx="50.5" cy="39.5" r="2"
            fill="#fff" stroke="#000" stroke-width=".6"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="0"
            data-nvp-bounds="48,37,5,5"/>
  </g>

  <!-- BLE PROFILE 2 -->
  <g id="ble-profile-2" data-nvp-widget="profile_tile">
    <rect x="60" y="37" width="19" height="15"
          rx="2" fill="#fff" stroke="#000"/>

    <text x="69.5" y="49"
          text-anchor="middle"
          font-family="monospace"
          font-size="12"
          font-weight="bold">2</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="1"
       data-nvp-bounds="60,37,19,15">

      <rect x="60" y="37" width="19" height="15"
            rx="4" fill="#000"/>

      <text x="69.5" y="49"
            text-anchor="middle"
            font-family="monospace"
            font-size="12"
            font-weight="bold"
            fill="#fff">2</text>
    </g>

    <circle cx="75.5" cy="39.5" r="2"
            fill="#fff" stroke="#000" stroke-width=".6"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="1"
            data-nvp-bounds="73,37,5,5"/>
  </g>

  <!-- BLE PROFILE 3 -->
  <g id="ble-profile-3" data-nvp-widget="profile_tile">
    <rect x="85" y="37" width="19" height="15"
          rx="2" fill="#fff" stroke="#000"/>

    <text x="94.5" y="49"
          text-anchor="middle"
          font-family="monospace"
          font-size="12"
          font-weight="bold">3</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="2"
       data-nvp-bounds="85,37,19,15">

      <rect x="85" y="37" width="19" height="15"
            rx="4" fill="#000"/>

      <text x="94.5" y="49"
            text-anchor="middle"
            font-family="monospace"
            font-size="12"
            font-weight="bold"
            fill="#fff">3</text>
    </g>

    <circle cx="100.5" cy="39.5" r="2"
            fill="#fff" stroke="#000" stroke-width=".6"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="2"
            data-nvp-bounds="98,37,5,5"/>
  </g>

  <!-- BLE PROFILE 4 -->
  <g id="ble-profile-4" data-nvp-widget="profile_tile">
    <rect x="110" y="37" width="19" height="15"
          rx="2" fill="#fff" stroke="#000"/>

    <text x="119.5" y="49"
          text-anchor="middle"
          font-family="monospace"
          font-size="12"
          font-weight="bold">4</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="3"
       data-nvp-bounds="110,37,19,15">

      <rect x="110" y="37" width="19" height="15"
            rx="4" fill="#000"/>

      <text x="119.5" y="49"
            text-anchor="middle"
            font-family="monospace"
            font-size="12"
            font-weight="bold"
            fill="#fff">4</text>
    </g>

    <circle cx="125.5" cy="39.5" r="2"
            fill="#fff" stroke="#000" stroke-width=".6"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="3"
            data-nvp-bounds="123,37,5,5"/>
  </g>

  <!-- BLE PROFILE 5 -->
  <g id="ble-profile-5" data-nvp-widget="profile_tile">
    <rect x="135" y="37" width="19" height="15"
          rx="2" fill="#fff" stroke="#000"/>

    <text x="144.5" y="49"
          text-anchor="middle"
          font-family="monospace"
          font-size="12"
          font-weight="bold">5</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="4"
       data-nvp-bounds="135,37,19,15">

      <rect x="135" y="37" width="19" height="15"
            rx="4" fill="#000"/>

      <text x="144.5" y="49"
            text-anchor="middle"
            font-family="monospace"
            font-size="12"
            font-weight="bold"
            fill="#fff">5</text>
    </g>

    <circle cx="150.5" cy="39.5" r="2"
            fill="#fff" stroke="#000" stroke-width=".6"
            data-nvp-slot="connected"
            data-nvp-bind="ble.connected_profiles"
            data-nvp-render="visible"
            data-nvp-when="set"
            data-nvp-bit="4"
            data-nvp-bounds="148,37,5,5"/>
  </g>

  <!-- DIVIDER -->
  <path d="M3 55H157" stroke="#000" stroke-width="1"/>

  <!-- OUTPUT STATUS -->
  <g id="connection-status" data-nvp-widget="connection">
    <text x="4" y="66"
          font-family="monospace"
          font-size="10"
          font-weight="bold"
          data-nvp-slot="selected"
          data-nvp-bind="output.selected"
          data-nvp-render="text"
          data-nvp-format="output-label">USB</text>

    <circle cx="35" cy="62" r="2.5"
            data-nvp-slot="selected"
            data-nvp-bind="output.selected"
            data-nvp-render="visible"
            data-nvp-when="usb"
            data-nvp-bounds="32.5,59.5,5,5"/>

    <circle cx="35" cy="62" r="2.5"
            data-nvp-slot="selected"
            data-nvp-bind="output.selected"
            data-nvp-render="visible"
            data-nvp-when="ble"
            data-nvp-bounds="32.5,59.5,5,5"/>
  </g>

  <!-- SPLIT STATUS -->
  <text x="105" y="66"
        font-family="monospace"
        font-size="10"
        font-weight="bold">SPLIT</text>

  <g id="split-link" data-nvp-widget="split_link">
    <circle cx="151" cy="62" r="2.5"
            data-nvp-slot="connected"
            data-nvp-bind="split.connected"
            data-nvp-render="visible"
            data-nvp-when="true"
            data-nvp-bounds="148.5,59.5,5,5"/>
  </g>

</svg>