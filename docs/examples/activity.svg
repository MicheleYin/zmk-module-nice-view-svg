<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="340"
     viewBox="0 0 160 68"
     shape-rendering="geometricPrecision">

      <title>ZMK SVG — Activity Rings</title>

  <rect width="160" height="68" fill="#000"/>

  <!-- ================= ACTIVITY RINGS ================= -->

  <g transform="translate(36 34) rotate(-90)">

    <!-- Left battery track -->
    <circle r="29"
            fill="none"
            stroke="#333"
            stroke-width="5"/>

    <!-- Left battery progress -->
    <circle r="29"
            fill="none"
            stroke="#fff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="158.5 182.2"/>

    <!-- Right battery track -->
    <circle r="21"
            fill="none"
            stroke="#333"
            stroke-width="5"/>

    <!-- Right battery progress -->
    <circle r="21"
            fill="none"
            stroke="#fff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="84.4 131.9"/>

  </g>

  <!-- ================= LEFT BATTERY ================= -->

  <g id="battery-left" data-nvp-widget="battery">

            <circle cx="36" cy="34" r="29"
                      fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"
                                    data-nvp-slot="level"
                                    data-nvp-bind="battery.left.percent"
                                    data-nvp-render="ring"/>

<!-- LEFT BATTERY -->

<text x="28" y="30"

      text-anchor="middle"

      fill="#fff"

      font-family="sans-serif"

      font-size="7"

      font-weight="bold"

      data-nvp-slot="level"

      data-nvp-bind="battery.left.percent"

      data-nvp-render="percent">87%</text>


    <!-- Charging icon inside rings, next to left percentage -->
    <path d="M41 22
             L37 28
             H40
             L39 33
             L45 26
             H42
             L44 22Z"
          fill="#fff"
          data-nvp-slot="charge"
          data-nvp-bind="battery.left.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="37,22,8,11"/>

  </g>

  <!-- ================= RIGHT BATTERY ================= -->

  <g id="battery-right" data-nvp-widget="battery">

            <circle cx="36" cy="34" r="21"
                      fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"
                                    data-nvp-slot="level"
                                    data-nvp-bind="battery.right.percent"
                                    data-nvp-render="ring"/>


<!-- RIGHT BATTERY -->

<text x="28" y="43"

      text-anchor="middle"

      fill="#aaa"

      font-family="sans-serif"

      font-size="7"

      font-weight="bold"

      data-nvp-slot="level"

      data-nvp-bind="battery.right.percent"

      data-nvp-render="percent">64%</text>

    <!-- Charging icon inside rings, next to right percentage -->
    <path d="M41 35
             L37 41
             H40
             L39 46
             L45 39
             H42
             L44 35Z"
          fill="#aaa"
          data-nvp-slot="charge"
          data-nvp-bind="battery.right.charge"
          data-nvp-render="visible"
          data-nvp-when="charging"
          data-nvp-bounds="37,35,8,11"/>

  </g>

  <!-- ================= LAYER ================= -->

  <g id="layer-display" data-nvp-widget="layer">

    <text x="95" y="12"
          text-anchor="middle"
          fill="#aaa"
          font-family="sans-serif"
          font-size="7"
          font-weight="bold">LAYER</text>

    <text x="95" y="46"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="38"
          font-weight="bold"
          data-nvp-slot="value"
          data-nvp-bind="layer.index"
          data-nvp-render="text">0</text>

    <rect x="83" y="51"
          width="24" height="3"
          rx="1.5"
          fill="#fff"/>

  </g>

  <!-- ================= HOST ================= -->

  <g id="connection-status" data-nvp-widget="connection">

    <rect x="120" y="5"
          width="36" height="17"
          rx="8.5"
          fill="#fff"/>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="usb"
       data-nvp-bounds="120,5,36,17">

      <text x="138" y="16"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="9"
            font-weight="bold">USB</text>

    </g>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="ble"
       data-nvp-bounds="120,5,36,17">

      <text x="138" y="16"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="9"
            font-weight="bold">BLE</text>

    </g>

    <g data-nvp-slot="selected"
       data-nvp-bind="output.selected"
       data-nvp-render="visible"
       data-nvp-when="none"
       data-nvp-bounds="120,5,36,17">

      <text x="138" y="16"
            text-anchor="middle"
            font-family="sans-serif"
            font-size="9"
            font-weight="bold">OFF</text>

    </g>

  </g>

  <!-- ================= BLE PROFILES ================= -->

  <text x="138" y="32"
        text-anchor="middle"
        fill="#aaa"
        font-family="sans-serif"
        font-size="6"
        font-weight="bold">PROFILES</text>

  <g id="profile-1" data-nvp-widget="profile_tile">

    <circle cx="124" cy="42" r="6" fill="#333"/>

    <text x="124" y="44"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="7">1</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="0"
       data-nvp-bounds="118,36,12,12">

      <circle cx="124" cy="42" r="6" fill="#fff"/>

      <text x="124" y="44"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="7">1</text>

    </g>

  </g>

  <g id="profile-2" data-nvp-widget="profile_tile">

    <circle cx="138" cy="42" r="6" fill="#333"/>

    <text x="138" y="44"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="7">2</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="1"
       data-nvp-bounds="132,36,12,12">

      <circle cx="138" cy="42" r="6" fill="#fff"/>

      <text x="138" y="44"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="7">2</text>

    </g>

  </g>

  <g id="profile-3" data-nvp-widget="profile_tile">

    <circle cx="152" cy="42" r="6" fill="#333"/>

    <text x="152" y="44"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="7">3</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="2"
       data-nvp-bounds="146,36,12,12">

      <circle cx="152" cy="42" r="6" fill="#fff"/>

      <text x="152" y="44"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="7">3</text>

    </g>

  </g>

  <g id="profile-4" data-nvp-widget="profile_tile">

    <circle cx="131" cy="57" r="6" fill="#333"/>

    <text x="131" y="59"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="7">4</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="3"
       data-nvp-bounds="125,51,12,12">

      <circle cx="131" cy="57" r="6" fill="#fff"/>

      <text x="131" y="59"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="7">4</text>

    </g>

  </g>

  <g id="profile-5" data-nvp-widget="profile_tile">

    <circle cx="145" cy="57" r="6" fill="#333"/>

    <text x="145" y="59"
          text-anchor="middle"
          fill="#fff"
          font-family="sans-serif"
          font-size="7">5</text>

    <g data-nvp-slot="active"
       data-nvp-bind="ble.active_profile"
       data-nvp-render="visible"
       data-nvp-when="4"
       data-nvp-bounds="139,51,12,12">

      <circle cx="145" cy="57" r="6" fill="#fff"/>

      <text x="145" y="59"
            text-anchor="middle"
            fill="#000"
            font-family="sans-serif"
            font-size="7">5</text>

    </g>

  </g>

  <!-- ================= SPLIT LINK ================= -->

  <g id="split-link" data-nvp-widget="split_link">

    <circle cx="155" cy="63" r="2"
            fill="#fff"
            data-nvp-slot="connected"
            data-nvp-bind="split.connected"
            data-nvp-render="visible"
            data-nvp-when="true"
            data-nvp-role="peripheral"
            data-nvp-bounds="153,61,4,4"/>

  </g>

</svg>
