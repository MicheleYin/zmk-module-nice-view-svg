<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nice!view SVG Live Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      color: #182421;
      background: #edf1ee;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      color: #f6f7f4;
      background: #182421;
      border-bottom: 3px solid #c5e27a;
    }
    .brand { font-size: 14px; font-weight: 700; }
    .source { color: #c4d0ca; font-size: 12px; overflow-wrap: anywhere; }
    .header-controls { display: flex; align-items: center; gap: 16px; }
    .role-control { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    select, input { font: inherit; }
    select {
      min-height: 32px;
      border: 1px solid #aab8b1;
      border-radius: 3px;
      padding: 4px 8px;
      color: #182421;
      background: #fff;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
      min-height: calc(100vh - 55px);
    }
    .stage {
      min-width: 0;
      padding: 18px;
      border-right: 1px solid #cbd4ce;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding-bottom: 16px;
    }
    .toolbar label { display: grid; gap: 4px; color: #53635c; font-size: 10px; }
    .previews { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .preview-panel { min-width: 0; }
    .preview-heading { display: flex; justify-content: space-between; gap: 10px; padding: 0 0 7px; font-size: 12px; }
    .preview-role { color: #697870; }
    .preview-tools { display: flex; align-items: center; gap: 4px; padding-bottom: 7px; }
    .preview-tools button {
      display: grid;
      width: 28px;
      height: 26px;
      place-items: center;
      border: 1px solid #aab8b1;
      border-radius: 3px;
      color: #182421;
      background: #fff;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }
    .preview-tools button:hover { background: #e4ebdf; }
    .preview-tools button[aria-pressed="true"] { border-color: #52752d; background: #dbe7cf; }
    .preview-tools button:focus-visible { outline: 2px solid #52752d; outline-offset: 2px; }
    .preview-orientation { min-width: 34px; color: #53635c; font-size: 10px; text-align: right; }
    .screen-frame {
      width: var(--frame-width, 100%);
      aspect-ratio: var(--frame-ratio, 160 / 68);
      display: grid;
      place-items: center;
      justify-self: center;
    }
    .screen {
      display: grid;
      flex: none;
      place-items: center;
      overflow: hidden;
      border: 1px solid #35433d;
      background: #fff;
      box-shadow: 0 12px 28px #18242120;
      transform-origin: center;
    }
    .preview-image { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .screen-meta { display: flex; justify-content: space-between; gap: 8px; padding-top: 6px; color: #53635c; font-size: 10px; }
    #status { color: #45632a; text-align: right; }
    #status.error { color: #a23c32; }
    aside { min-width: 0; background: #f8faf8; }
    .controls-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 15px 16px 12px;
      border-bottom: 1px solid #cbd4ce;
      background: #f8faf8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    #fields { max-height: calc(100vh - 102px); overflow: auto; }
    .field {
      display: grid;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e6e2;
    }
    .field.disabled { opacity: .45; }
    .field-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .field-name { font-size: 12px; overflow-wrap: anywhere; }
    .field-kind { color: #697870; font-size: 10px; white-space: nowrap; }
    .field-description { color: #53635c; font-size: 10px; line-height: 1.35; }
    .field input[type="text"], .field input[type="number"] {
      width: 100%;
      min-height: 32px;
      border: 1px solid #aab8b1;
      border-radius: 3px;
      padding: 5px 8px;
      background: #fff;
    }
    .range-row { display: grid; grid-template-columns: 1fr 54px; align-items: center; gap: 10px; }
    input[type="range"] { width: 100%; accent-color: #52752d; }
    .range-value, .mask-value { color: #53635c; font-size: 11px; text-align: right; }
    .toggle, .bit-toggle { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .toggle input, .bit-toggle input { accent-color: #52752d; }
    .bit-list { display: flex; flex-wrap: wrap; gap: 8px 12px; }
    #fields { max-height: calc(100vh - 102px); overflow: auto; }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; padding: 10px 14px; }
      main { grid-template-columns: 1fr; }
      .stage { padding: 14px; border-right: 0; border-bottom: 1px solid #cbd4ce; }
      .previews { grid-template-columns: 1fr; }
      #fields { max-height: none; }
      .controls-heading { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">ZMK SVG / LIVE PREVIEW</div>
      <div class="source" id="source"></div>
    </div>
    <div class="header-controls">
      <label class="role-control">Central side
        <select id="central-side">
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </label>
      <label class="role-control">Polarity
        <select id="inversion">
          <option value="legacy">Legacy</option>
          <option value="white-background">White background</option>
        </select>
      </label>
    </div>
  </header>
  <main>
    <section class="stage" aria-label="Left and right screen previews">
      <div class="toolbar">
        <label>Display type
          <select id="display">
            <option value="niceview">Nice!View · 160 × 68</option>
            <option value="oled">OLED · 128 × 32</option>
          </select>
        </label>
        <label>Artwork
          <select id="source-mode">
            <option value="distinct">Different left and right</option>
            <option value="shared">Same on both sides</option>
          </select>
        </label>
        <label>Edit values for
          <select id="edit-side">
            <option value="left">Left side</option>
            <option value="right">Right side</option>
          </select>
        </label>
      </div>
      <div class="previews">
        <article class="preview-panel">
          <div class="preview-heading"><strong>Left</strong><span class="preview-role" id="role-left"></span></div>
          <div class="preview-tools" aria-label="Left preview orientation">
            <button type="button" data-side="left" data-action="rotate-left" aria-label="Rotate left preview counterclockwise" title="Rotate counterclockwise">↶</button>
            <button type="button" data-side="left" data-action="rotate-right" aria-label="Rotate left preview clockwise" title="Rotate clockwise">↷</button>
            <button type="button" data-side="left" data-action="flip-x" aria-pressed="false" aria-label="Flip left preview horizontally" title="Flip horizontally">↔</button>
            <button type="button" data-side="left" data-action="flip-y" aria-pressed="false" aria-label="Flip left preview vertically" title="Flip vertically">↕</button>
            <button type="button" data-side="left" data-action="reset" aria-label="Reset left preview orientation" title="Reset orientation">⟲</button>
            <output class="preview-orientation" id="orientation-left" aria-live="polite">0°</output>
          </div>
          <div class="screen-frame" id="frame-left" data-side="left">
            <div class="screen" id="screen-left"><img class="preview-image" id="preview-left" alt="Left-side status screen"></div>
          </div>
          <div class="screen-meta"><span id="dimensions-left"></span><span id="status-left" aria-live="polite">Loading</span></div>
        </article>
        <article class="preview-panel">
          <div class="preview-heading"><strong>Right</strong><span class="preview-role" id="role-right"></span></div>
          <div class="preview-tools" aria-label="Right preview orientation">
            <button type="button" data-side="right" data-action="rotate-left" aria-label="Rotate right preview counterclockwise" title="Rotate counterclockwise">↶</button>
            <button type="button" data-side="right" data-action="rotate-right" aria-label="Rotate right preview clockwise" title="Rotate clockwise">↷</button>
            <button type="button" data-side="right" data-action="flip-x" aria-pressed="false" aria-label="Flip right preview horizontally" title="Flip horizontally">↔</button>
            <button type="button" data-side="right" data-action="flip-y" aria-pressed="false" aria-label="Flip right preview vertically" title="Flip vertically">↕</button>
            <button type="button" data-side="right" data-action="reset" aria-label="Reset right preview orientation" title="Reset orientation">⟲</button>
            <output class="preview-orientation" id="orientation-right" aria-live="polite">0°</output>
          </div>
          <div class="screen-frame" id="frame-right" data-side="right">
            <div class="screen" id="screen-right"><img class="preview-image" id="preview-right" alt="Right-side status screen"></div>
          </div>
          <div class="screen-meta"><span id="dimensions-right"></span><span id="status-right" aria-live="polite">Loading</span></div>
        </article>
      </div>
    </section>
    <aside>
      <div class="controls-heading">Bound status fields</div>
      <div id="fields"></div>
    </aside>
  </main>
  <script type="module">
    const centralSideSelect = document.querySelector("#central-side");
    const displaySelect = document.querySelector("#display");
    const sourceModeSelect = document.querySelector("#source-mode");
    const editSideSelect = document.querySelector("#edit-side");
    const inversionSelect = document.querySelector("#inversion");
    const fieldsRoot = document.querySelector("#fields");
    const previewImages = {
      left: document.querySelector("#preview-left"),
      right: document.querySelector("#preview-right"),
    };
    const screens = {
      left: document.querySelector("#screen-left"),
      right: document.querySelector("#screen-right"),
    };
    const screenFrames = {
      left: document.querySelector("#frame-left"),
      right: document.querySelector("#frame-right"),
    };
    const statuses = {
      left: document.querySelector("#status-left"),
      right: document.querySelector("#status-right"),
    };
    const previewTransforms = {
      left: { rotation: 0, flipX: false, flipY: false },
      right: { rotation: 0, flipX: false, flipY: false },
    };
    const controlState = new Map();
    let config;
    let activeUrls = { left: null, right: null };
    let requestControllers = { left: null, right: null };
    let renderTimer;
    let revisionTimer;

    function currentRole(side = editSideSelect.value) {
      return side === centralSideSelect.value ? "central" : "peripheral";
    }

    function currentDisplayConfig() {
      return config.displays[displaySelect.value];
    }

    function updatePreviewCanvasSize(side) {
      if (!config) return;
      const orientation = previewTransforms[side];
      const frame = screenFrames[side];
      const rotated = orientation.rotation % 180 !== 0;
      const { width, height } = currentDisplayConfig().screens[side];
      const canvasWidth = frame.parentElement.clientWidth;
      const canvasHeight = canvasWidth * height / width;
      frame.style.setProperty("--frame-width", `${rotated ? canvasHeight : canvasWidth}px`);
      screens[side].style.width = `${canvasWidth}px`;
      screens[side].style.height = `${canvasHeight}px`;
    }

    function updatePreviewOrientation(side) {
      const orientation = previewTransforms[side];
      const screen = currentDisplayConfig().screens[side];
      const rotated = orientation.rotation % 180 !== 0;
      screenFrames[side].style.aspectRatio = rotated
        ? `${screen.height} / ${screen.width}`
        : `${screen.width} / ${screen.height}`;
      screens[side].style.transform = [
        `rotate(${orientation.rotation}deg)`,
        `scaleX(${orientation.flipX ? -1 : 1})`,
        `scaleY(${orientation.flipY ? -1 : 1})`,
      ].join(" ");
      previewImages[side].style.transform = "none";
      updatePreviewCanvasSize(side);
      document.querySelector(`[data-side="${side}"][data-action="flip-x"]`)
        .setAttribute("aria-pressed", String(orientation.flipX));
      document.querySelector(`[data-side="${side}"][data-action="flip-y"]`)
        .setAttribute("aria-pressed", String(orientation.flipY));
      document.querySelector(`#orientation-${side}`).textContent = `${orientation.rotation}°`;
    }

    const frameObserver = new ResizeObserver(entries => {
      for (const entry of entries) updatePreviewCanvasSize(entry.target.dataset.side);
    });
    for (const frame of Object.values(screenFrames)) frameObserver.observe(frame);

    for (const button of document.querySelectorAll(".preview-tools button")) {
      button.addEventListener("click", () => {
        const orientation = previewTransforms[button.dataset.side];
        switch (button.dataset.action) {
          case "rotate-left":
            orientation.rotation = (orientation.rotation + 270) % 360;
            break;
          case "rotate-right":
            orientation.rotation = (orientation.rotation + 90) % 360;
            break;
          case "flip-x":
            orientation.flipX = !orientation.flipX;
            break;
          case "flip-y":
            orientation.flipY = !orientation.flipY;
            break;
          case "reset":
            Object.assign(orientation, { rotation: 0, flipX: false, flipY: false });
            break;
        }
        updatePreviewOrientation(button.dataset.side);
      });
    }

    function createEnumControl(field, editor, state) {
      const select = document.createElement("select");
      for (const value of field.values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.append(option);
      }
      state.controls = [select];
      state.read = () => select.value;
      state.write = value => { select.value = value; };
      editor.append(select);
    }

    function createBooleanControl(field, editor, state) {
      const label = document.createElement("label");
      label.className = "toggle";
      const input = document.createElement("input");
      input.type = "checkbox";
      label.append(input, document.createTextNode(field.control_label ?? "Enabled"));
      editor.append(label);
      state.controls = [input];
      state.read = () => input.checked;
      state.write = value => { input.checked = Boolean(value); };
    }

    function createBitmaskControl(field, editor, state) {
      const list = document.createElement("div");
      list.className = "bit-list";
      for (let bit = 0; bit < field.bits; bit++) {
        const label = document.createElement("label");
        label.className = "bit-toggle";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.bit = bit;
        label.append(input, document.createTextNode(`Profile ${bit + 1}`));
        list.append(label);
        state.controls.push(input);
      }
      editor.append(list);
      const mask = document.createElement("div");
      mask.className = "mask-value";
      editor.append(mask);
      state.read = () => state.controls.reduce(
        (value, input) => input.checked ? value | (1 << Number(input.dataset.bit)) : value,
        0,
      );
      state.write = value => {
        const bits = Number(value) || 0;
        for (const input of state.controls) {
          input.checked = Boolean(bits & (1 << Number(input.dataset.bit)));
        }
        mask.textContent = `Mask: ${bits}`;
      };
    }

    function createPercentControl(field, editor, state) {
      const line = document.createElement("div");
      line.className = "range-row";
      const input = document.createElement("input");
      input.type = "range";
      input.min = field.minimum ?? 0;
      input.max = field.maximum ?? 100;
      input.step = "1";
      const output = document.createElement("output");
      output.className = "range-value";
      line.append(input, output);
      editor.append(line);
      state.controls = [input];
      state.read = () => Number(input.value);
      state.write = value => {
        input.value = value ?? input.min;
        output.textContent = `${input.value}%`;
      };
      input.addEventListener("input", () => {
        output.textContent = `${input.value}%`;
        saveCurrentValue(state);
        queueRender();
      });
    }

    function createTextControl(field, editor, state) {
      const input = document.createElement("input");
      input.type = field.type === "string" ? "text" : "number";
      if (field.minimum !== undefined) input.min = field.minimum;
      if (field.maximum !== undefined) input.max = field.maximum;
      if (field.type === "integer") input.step = "1";
      editor.append(input);
      state.controls = [input];
      state.read = () => field.type === "string" ? input.value : Number(input.value);
      state.write = value => { input.value = value ?? ""; };
    }

    function createField(field) {
      const row = document.createElement("section");
      row.className = "field";
      const heading = document.createElement("div");
      heading.className = "field-heading";
      const name = document.createElement("span");
      name.className = "field-name";
      name.textContent = field.id;
      const kind = document.createElement("span");
      kind.className = "field-kind";
      kind.textContent = `${field.type} · ${field.renderers.join(", ")}`;
      heading.append(name, kind);
      let description;
      if (field.role_descriptions) {
        description = document.createElement("div");
        description.className = "field-description";
        description.textContent = field.role_descriptions[currentRole()] ?? "";
      }
      const editor = document.createElement("div");
      if (description) row.append(heading, description, editor);
      else row.append(heading, editor);

      const state = {
        field,
        row,
        editor,
        description,
        controls: [],
        read: () => null,
        write: () => {},
      };
      const builders = {
        enum: createEnumControl,
        boolean: createBooleanControl,
        bitmask: createBitmaskControl,
        percent: createPercentControl,
        integer: createTextControl,
        string: createTextControl,
      };
      builders[field.type](field, editor, state);

      for (const input of state.controls) {
        input.addEventListener("change", () => {
          saveCurrentValue(state);
          if (field.type === "bitmask") state.write(state.read());
          queueRender();
        });
      }
      fieldsRoot.append(row);
      controlState.set(field.id, state);
      return state;
    }

    function saveCurrentValue(state) {
      currentDisplayConfig().values[currentRole()][state.field.id] = state.read();
    }

    function syncControls() {
      const role = currentRole();
      const values = currentDisplayConfig().values[role];
      for (const state of controlState.values()) {
        const available = state.field.roles.includes(role)
          && currentDisplayConfig().screens[editSideSelect.value].bindings
            .some(binding => binding.id === state.field.id);
        state.row.classList.toggle("disabled", !available);
        for (const input of state.controls) input.disabled = !available;
        if (state.description) {
          state.description.textContent = state.field.role_descriptions[role] ?? "";
        }
        if (values[state.field.id] !== undefined) state.write(values[state.field.id]);
      }
    }

    function rebuildFields() {
      fieldsRoot.replaceChildren();
      controlState.clear();
      const sourceSide = sourceModeSelect.value === "shared" ? "left" : editSideSelect.value;
      const bindings = currentDisplayConfig().screens[sourceSide].bindings;
      const seen = new Set();
      for (const binding of bindings) {
        if (!seen.has(binding.id)) {
          seen.add(binding.id);
          createField(binding);
        }
      }
      syncControls();
    }

    function queueRender() {
      clearTimeout(renderTimer);
      for (const sideStatus of Object.values(statuses)) {
        sideStatus.textContent = "Rendering…";
      }
      renderTimer = setTimeout(renderPreview, 90);
    }

    async function renderSide(side) {
      requestControllers[side]?.abort();
      requestControllers[side] = new AbortController();
      const role = currentRole(side);
      statuses[side].classList.remove("error");
      statuses[side].textContent = "Rendering…";
      try {
        const response = await fetch("/render", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            display: displaySelect.value,
            side,
            centralSide: centralSideSelect.value,
            sourceMode: sourceModeSelect.value,
            values: currentDisplayConfig().values[role],
            inversionMode: inversionSelect.value,
          }),
          signal: requestControllers[side].signal,
        });
        if (!response.ok) throw new Error(await response.text());
        const nextUrl = URL.createObjectURL(await response.blob());
        previewImages[side].src = nextUrl;
        if (activeUrls[side]) URL.revokeObjectURL(activeUrls[side]);
        activeUrls[side] = nextUrl;
        statuses[side].textContent = "Ready";
      } catch (error) {
        if (error.name !== "AbortError") {
          statuses[side].classList.add("error");
          statuses[side].textContent = error.message;
        }
      }
    }

    async function renderPreview() {
      const centralSide = centralSideSelect.value;
      for (const side of ["left", "right"]) {
        document.querySelector(`#role-${side}`).textContent =
          side === centralSide ? "Central" : "Peripheral";
      }
      await Promise.all([renderSide("left"), renderSide("right")]);
    }

    function updateScreenMetadata() {
      const display = currentDisplayConfig();
      for (const side of ["left", "right"]) {
        const screen = display.screens[side];
        screens[side].style.setProperty("--screen-ratio", `${screen.width} / ${screen.height}`);
        document.querySelector(`#dimensions-${side}`).textContent =
          `${screen.width} × ${screen.height} px`;
        updatePreviewOrientation(side);
      }
      document.querySelector("#source").textContent =
        `${displaySelect.options[displaySelect.selectedIndex].text} · ${sourceModeSelect.value === "shared" ? "shared artwork" : "separate artwork"}`;
      for (const status of Object.values(statuses)) {
        status.classList.remove("error");
      }
    }

    function mergeValues(nextConfig, previousConfig) {
      if (!previousConfig) return;
      for (const [displayName, display] of Object.entries(nextConfig.displays)) {
        const previousDisplay = previousConfig.displays[displayName];
        if (!previousDisplay) continue;
        for (const role of ["central", "peripheral"]) {
          Object.assign(display.values[role], previousDisplay.values[role]);
          for (const fieldId of Object.keys(display.values[role])) {
            if (!display.bindings.some(binding => binding.id === fieldId)) {
              delete display.values[role][fieldId];
            }
          }
        }
      }
    }

    async function loadConfig() {
      const response = await fetch("/config");
      if (!response.ok) throw new Error(await response.text());
      const nextConfig = await response.json();
      if (config && nextConfig.revision === config.revision) {
        if (nextConfig.reloadError) {
          statuses.left.textContent = `SVG error: ${nextConfig.reloadError}`;
          statuses.right.textContent = `SVG error: ${nextConfig.reloadError}`;
          statuses.left.classList.add("error");
          statuses.right.classList.add("error");
        }
        return;
      }
      mergeValues(nextConfig, config);
      const firstLoad = !config;
      config = nextConfig;
      if (firstLoad) {
        centralSideSelect.value = config.initialCentralSide;
        displaySelect.value = config.initialDisplay;
        sourceModeSelect.value = config.initialSourceMode;
        inversionSelect.value = config.initialInversionMode;
      }
      document.title = `${config.title} · Nice!view Live Preview`;
      for (const screen of Object.values(screens)) {
        screen.style.background = inversionSelect.value === "legacy" && config.legacyInverted
          ? "#000"
          : "#fff";
      }
      updateScreenMetadata();
      rebuildFields();
      queueRender();
    }

    async function pollForSourceChanges() {
      try {
        await loadConfig();
      } catch (error) {
        statuses.left.textContent = error.message;
        statuses.right.textContent = error.message;
        statuses.left.classList.add("error");
        statuses.right.classList.add("error");
      }
      revisionTimer = setTimeout(pollForSourceChanges, 700);
    }

    try {
      await loadConfig();
      centralSideSelect.addEventListener("change", () => {
        rebuildFields();
        queueRender();
      });
      displaySelect.addEventListener("change", () => {
        updateScreenMetadata();
        rebuildFields();
        queueRender();
      });
      sourceModeSelect.addEventListener("change", () => {
        updateScreenMetadata();
        rebuildFields();
        queueRender();
      });
      editSideSelect.addEventListener("change", rebuildFields);
      inversionSelect.addEventListener("change", () => {
        updateScreenMetadata();
        queueRender();
      });
      pollForSourceChanges();
    } catch (error) {
      statuses.left.textContent = error.message;
      statuses.right.textContent = error.message;
    }
  </script>
</body>
</html>
